<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --skin: #da0;
        }

        .cartoon {
            width: 500px;
            height: 500px;
            background-color: var(--skin);
            border: 1vmin solid #d9a4;
            border-radius: 100% / 80% 80% 120% 120%;
            position: absolute;
            left: 50%;
            bottom: 30%;
            transform: translateX(-50%);
        }

        .cartoon::after {
            content: "";
            position: absolute;
            top: 30%;
            width: 90%;
            height: 100%;
            background-color: var(--skin);
            border: 1vmin solid;
            border-top: 0vmin solid;
            border-right: 0vmin solid;
            border-radius: 100% / 120% 120% 80% 80%;
            transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="cartoon">
        
    </div>
</body>
</html>
