<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
            justify-content: center;
            background-color: rgb(120, 222, 222);
        }

        .box {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 20px;
        }

        .one {
            top: 5px;
            left: 10px;
            background: 
            radial-gradient(10% 10% at 10% 10%, blue 40%, black 40% 60%, red 60% 70%, transparent 30%) 0% 0% / 100% 100%,
            radial-gradient(10% 10% at 60% 70%, blue 40%, black 40% 60%, red 60% 70%, transparent 30%) 0% 0% / 100% 100%,
            radial-gradient(10% 10% at 50% 50%, blue 40%, black 40% 60%, red 60% 70%, transparent 30%) 0% 0% / 100% 100%,
            radial-gradient(10% 10% at 60% 70%, blue 40%, black 40% 60%, red 60% 70%, transparent 30%) 0% 0% / 100% 100%,
            radial-gradient(10% 10% at 50% 50%, blue 40%, black 40% 60%, red 60% 70%, transparent 30%) 0% 0% / 100% 100%,
            radial-gradient(10% 10% at 60% 70%, blue 40%, black 40% 60%, red 60% 70%, transparent 30%) 0% 0% / 100% 100%,
            radial-gradient(20% 20% at 30% 35%, blue 40%, black 40% 60%, red 60% 70%, yellow 30%) 0% 0% / 100% 100%;
            background-repeat: no-repeat;
        }

        .two {
            left: 10px;
            top: 250px;
            background: 
            radial-gradient(.5% 130% at 27% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 26% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 25% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 24% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 23% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 22% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 21% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 20% 20%, black 50%, yellow 50%) 0% 0% / 100% 100%;
            ;
            background-repeat: no-repeat;
        }

        .three {
            left: 10px;
            top: 500px;
            background: 
            linear-gradient(90deg, green 1%, transparent 1%),
            linear-gradient(90deg, transparent 4%,green 4%, transparent 4%),
            linear-gradient(90deg, green 1%, transparent 1%),
            linear-gradient(90deg, green 1%, transparent 1%),
            linear-gradient(90deg, green 1%, transparent 1%),
            linear-gradient(90deg, green 1%, transparent 1%),
            linear-gradient(90deg, green 1%, transparent 1%),
            linear-gradient(90deg, green 1%, transparent 1%),
            linear-gradient(90deg, green 1%, yellow 1%)
            ;
            background-repeat: no-repeat;
        }

        .four {
            top: 5px;
            left: 300px;
            background:
                linear-gradient(90deg, green 40%, yellow 1%)
            ;
            clip-path: circle();
            background-repeat: no-repeat;
        }

        .five {
            left: 300px;
            top: 250px;
            background:
                linear-gradient(90deg, green 40%, yellow 1%)
            ;
            clip-path: ellipse();
            background-repeat: no-repeat;
        }

        .six {
            left: 300px;
            top: 500px;
            background:
                linear-gradient(90deg, green 40%, yellow 1%)
            ;
            clip-path: polygon();
            background-repeat: no-repeat;
        }

        .seven {
            left: 10px;
            top: 750px;
            background:
                linear-gradient(90deg, green 40%, yellow 1%)
            ;
            clip-path:fill-box;
            background-repeat: no-repeat;
        }

        .eight {
            left: 300px;
            top: 750px;
            background:
            radial-gradient(.5% 130% at 27% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 26% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 25% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 24% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 23% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 22% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 21% 20%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(12% 12% at 23.6% 80%, black 50%, transparent 50%) 0% 0% / 100% 100%,
            radial-gradient(.5% 130% at 20% 20%, black 50%, yellow 50%) 0% 0% / 100% 100%
            ;
            background-repeat: no-repeat;
        }

        .nine {
            left: 10px;
            top: 1000px;
            background:
                repeating-linear-gradient(90deg, blue 10%, transparent 15.1%),
                repeating-linear-gradient(180deg, blue 10%, black 15.1%)
            ;
            background-repeat: no-repeat;
        }

        .ten {
            left: 300px;
            top: 1000px;
            background:
                repeating-radial-gradient(15% 130% at 20% 20%, black 50%, yellow 5%) 0% 0% / 100% 100%
            ;
            clip-path:fill-box;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <div class="box one"></div>
    <div class="box two"></div>
    <div class="box three"></div>
    <div class="box four"></div>
    <div class="box five"></div>
    <div class="box six"></div>
    <div class="box seven"></div>
    <div class="box eight"></div>
    <div class="box nine"></div>
    <div class="box ten"></div>
</body>
</html>
