<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: center;
            background-color: azure;
        }

        .container {
            position: absolute;
            top: 10%;
            width: 500px;
            height: 650px;
            border: 1vmin solid;
        }

        .part-1 {
            position: absolute;
            top: 8%;
            left: 23%;
            width: 250px;
            height: 400px;
            border: 1vmin solid;
            background: black;
            border-radius: 100% / 70% 70% 140% 140%;
        }

        .part-2 {
            position: absolute;
            bottom: 2%;
            left: 23%;
            width: 250px;
            height: 400px;
            border: 1vmin solid;
            background: black;
            border-radius: 100% / 140% 140% 40% 40%;
        }

        .head {
            position: absolute;
            left: 9%;
            top: 5%;
            width: 200px;
            height: 200px;
            background-color: bisque;
            border-radius: 100% / 80% 80% 80% 80%;
            z-index: 2;
        }

        .head::before {
            content: "";
            position: absolute;
            top: 0%;
            width: 100%;
            height: 100%;
            background: radial-gradient(100% 100% at 52% 100%, transparent 82%, rgb(89, 17, 17) 85.9%, black 85.4%) 0% 0% / 100% 100%;
            background-repeat: no-repeat;
            border-top-left-radius: 20%;
            border-top-right-radius: 20%;
        }

        .ear {
            position: absolute;
            top: 45%;
            width: 20%;
            height: 20%;
            background: bisque;
            border-radius: 50%;
        }

        .ear.left {
            left: -7%;
        }

        .ear.right {
            right: -7%;
        }

        .nose {
            position: absolute;
            bottom: 25%;
            left: 45%;
            width: 10%;
            height: 10%;
            border: .5vmin solid;
            border-left: .5vmin transparent;
            border-right: .5vmin transparent;
            border-bottom: .5vmin transparent;
            border-radius: 40%;
        }

        .mouth {
            position: absolute;
            bottom: 12%;
            left: 41%;
            width: 20%;
            height: 15%;
            border-radius: 47%;
            border: .4vmin solid;
            border-left: .4vmin transparent;
            border-right: .4vmin transparent;
            border-top: .4vmin transparent;
        }

        .eye {
            position: absolute;
            top: 35%;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: 
            radial-gradient(10% 10% at 32% 32%, white 28%, transparent 20.2%) 0% 0% / 100% 100%,
            radial-gradient(10% 10% at 28% 25%, white 40%, transparent 20.2%) 0% 0% / 100% 100%,
            radial-gradient(10% 10% at 20% 35%, white 70%, transparent 20.2%) 0% 0% / 100% 100%,
            radial-gradient(50% 50% at 50% 47.5%, black 70%, brown 90%, white 20%) 0% 0% / 100% 100%;
            background-repeat: no-repeat;
        }

        .eye.left {
            left: 7%;
        }

        .eye.right {
            right: 7%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="part-1">
            <div class="head">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="nose"></div>
                <div class="mouth"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
            </div>
        </div>
        <div class="part-2">

        </div>
    </div>
</body>
</html>
