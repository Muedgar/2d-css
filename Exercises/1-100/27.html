<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(78, 190, 181);
        }

        .container {
            position: absolute;
            top: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .container .nose {
            position: absolute;
            width: 200px;
            height: 200px;
            background: black;
            clip-path: polygon(0% 0%, 30% 80%, 0% 90%);
        }

        .part-1 {
            position: absolute;
            top: 54%;
            left: 38%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: black;
        }

        .part-1::after {
            content: "";
            position: absolute;
            top: 20px;
            left: 20px;
            width: 15px;
            height: 15px;
            background: rgb(50, 50, 51);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nose">
        </div>
        <div class="part-1"></div>
    </div>
</body>
</html>
