<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(225, 136, 255);
            display: grid;
            place-items: center;
            transform-style: preserve-3d;
            perspective: 80em;
        }

        .circlez {
            position: absolute;
            top: 10%;
            width: 400px;
            height: 400px;
            border: 1vmin solid;
            border-radius: 50%;
            background: repeating-radial-gradient(10% 10% at 50% 50%, black 20% 50%, yellow 50% 60%) 0 0 / 100% 100%;
            animation: rotate 2s infinite;
        }

        @keyframes rotate {
            0% {
                transform: rotateZ(0)
            }

            50% {
                transform: rotateZ(360deg)
            }
        }
    </style>
</head>
<body>
    <div class="circlez"></div>
</body>
</html>
