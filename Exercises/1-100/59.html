<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
body {
    margin: 0;
    min-height: 100vh;
    background: burlywood;
    display: grid;
    place-items: center;
}

.container {
    width: 100px;
    height: 100px;
    background: transparent;
    display: grid;
    place-items: center;
    perspective: 500px;
}

.circle {
    position: relative;
    width: 50px;
    height: 50px;
    border: 4px solid yellow;
    border-radius: 50%;

    transform-style: preserve-3d;
    animation: rotateCircle 2s linear infinite;
}

.circle::before,
.circle::after {
    content: "";
    position: absolute;
    inset: -4px;
    border: 4px solid;
    border-radius: 50%;
}

.circle::before {
    border-color: green;
    transform: rotateX(60deg);
}

.circle::after {
    border-color: blue;
    transform: rotateY(60deg);
}

@keyframes rotateCircle {
    from {
        transform: rotateY(0deg) rotateX(0deg);
    }

    to {
        transform: rotateY(360deg) rotateX(360deg);
    }
}

    </style>
</head>
<body>
    <div class="container">
        <div class="circle"></div>
    </div>
</body>
</html>
