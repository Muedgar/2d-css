<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #9ea;
            display: grid;
            place-items: center;
        }

        .face {
            position: absolute;
            top: 100px;
            width: 200px;
            height: 200px;
            border: 1vmin solid transparent;
            border-radius: 50%;
            overflow: hidden;
            background-color: #023;
        }

        .face::before {
            content: "";
            position: absolute;
            left: 50px;
            top: -10px;
            width: 200px;
            height: 200px;
            background: rgba(49, 51, 65, 0.401);
            clip-path: polygon(30% 0%, 25% 25%, 20% 30%, 0% 40%, 0% 70%, 25% 100%, 100% 100%, 100% 0);
        }
    </style>
</head>
<body>
    <div class="face"></div>
</body>
</html>
