<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #9485;
            display: grid;
            place-items: center;
            transform-style: preserve-3d;
            perspective: 80em;
        }

        .text {
            position: absolute;
            top: 100px;
            display: flex;
        }

        .text p {
            font-size: 10em;
            font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            animation: bubble 500ms ease-in-out infinite alternate;
            transform: translateY(0) rotateX(70deg);
        }

        .text p:nth-child(1) {
            animation-delay: 1s;
        }

        .text p:nth-child(2) {
            animation-delay: 1.1s;
        }

        .text p:nth-child(3) {
            animation-delay: 1.2s;
        }

        .text p:nth-child(4) {
            animation-delay: 1.3s;
        }

        .text p:nth-child(5) {
            animation-delay: 1.4s;
        }

        @keyframes bubble {
            from {
                transform: translateY(0) rotateX(70deg);
            }

            to {
                transform: translateY(-20px) rotateX(70deg);
            }
        }
    </style>
</head>
<body>
    <div class="text">
        <p>H</p>
        <p>E</p>
        <p>L</p>
        <p>L</p>
        <p>O</p>
    </div>
</body>
</html>
