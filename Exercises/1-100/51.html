<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #92a;
        }
        
        .scene {
            position: absolute;
            top: 50%;
            left: 50%;
            background: #3da3;
            width: 30vw;
            height: 30vh;
            transform-style: preserve-3d;
            perspective: 80em;
            animation: rotation 10s ease-in-out infinite alternate;
        }

        .face-1 {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: black;
            transform: translateZ(100px) rotateY(80deg);
        }

        .face-2 {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: black;
            transform: translateZ(100px) translateY(50px) translateX(50px) rotateY(80deg) rotateX(90deg);
        }

        .face-3 {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: black;
            transform: translateZ(100px) translateX(100px) rotateY(80deg);
        }

        @keyframes rotation {
            from {
                transform: rotateY(0);
            }
            
            to {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="face-1"></div>
        <div class="face-2"></div>
        <div class="face-3"></div>
    </div>
</body>
</html>
