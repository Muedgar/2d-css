<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #2934;
            display: grid;
            place-items: center;
            transform-style: preserve-3d;
            perspective: 80em;
        }

        button {
            position: absolute;
            top: 200px;
            padding: 10px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 3em;
            font-weight: bolder;
            border: 0 solid transparent;  
            cursor: pointer;
            transition: all 100ms ease-in-out;
        }

        button:hover {
            transform: translateZ(-50px) translateY(10px) rotateX(60deg) scale(2);
        }
    </style>
</head>
<body>
    <button>Submit</button>
</body>
</html>
