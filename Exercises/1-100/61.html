
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>3D Cube</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #2805;
            display: grid;
            place-items: center;
            perspective: 900px;
        }

        .scene {
            position: relative;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            animation: rotateCube 6s linear infinite;
            perspective: 80em;
        }

        .face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: black;
            border: 1px solid white;
            opacity: 0.9;
            box-sizing: border-box;
        }

        /* Front */
        .face:nth-child(1) {
            transform: translateZ(50px);
            background: #499;
        }

        /* Back */
        .face:nth-child(2) {
            transform: rotateY(180deg) translateZ(50px);
            background: #928;
        }

        /* Right */
        .face:nth-child(3) {
            transform: rotateY(90deg) translateZ(50px);
            background: #a55;
        }

        /* Left */
        .face:nth-child(4) {
            transform: rotateY(-90deg) translateZ(50px);
            background: #595;
        }

        /* Top */
        .face:nth-child(5) {
            transform: rotateX(90deg) translateZ(50px);
            background: #559;
        }

        /* Bottom */
        .face:nth-child(6) {
            transform: rotateX(-90deg) translateZ(50px);
            background: #995;
        }

        @keyframes rotateCube {
            from {
                transform: rotateX(-25deg) rotateY(0deg);
            }

            to {
                transform: rotateX(-25deg) rotateY(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
    </div>
</body>
</html>
