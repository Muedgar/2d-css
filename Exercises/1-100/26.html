<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(255, 240, 105);
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .mouth {
            position: absolute;
            width: 200px;
            height: 100px;
            border: 4vmin solid salmon;
            border-radius: 40% 40% 40% 40% / 30% 30% 30% 30%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .mouth .upper-teeth {
            position: absolute;
            top: 0;
            left: 10px;
            width: 90%;
            height: 30%;
            background: white;
            border-radius: 20% 20% 10% 10% / 20% 50% 20% 20%;
        }

        .mouth .lower-teeth {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 90%;
            height: 30%;
            background: white;
            border-radius: 10% 10% 20% 20% / 20% 50% 20% 20%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mouth">
            <div class="upper-teeth"></div>
            <div class="lower-teeth"></div>
            <div class="tongue"></div>
            <div class="inner-section"></div>
        </div>
    </div>
</body>
</html>
