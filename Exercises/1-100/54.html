<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(124, 191, 183);
            display: grid;
            place-items: center;
        }

        .scene {
            position: absolute;
            top: 30%;
            width: 200px;
            height: 200px;
            background: transparent;
            transform-style: preserve-3d;
            perspective: 80em;
        }

        .box {
            position: absolute;
            width: 100px;
            height: 100px;
            background: black;
        }

        .box:nth-child(1) {
            left: 0;
            top: 0;
            background-color: antiquewhite;
            animation: rotateOne 1s infinite linear;
        }

        .box:nth-child(2) {
            right: 0;
            top: 0;
            background-color: aquamarine;
            animation: rotateTwo 1s infinite linear;
        }

        .box:nth-child(3) {
            bottom: 0;
            left: 0;
            background-color: rgb(171, 90, 90);
            animation: rotateThree 1s infinite linear;
        }

        .box:nth-child(4) {
            bottom: 0;
            right: 0;
            background-color: cadetblue;
            animation: rotateFour 1s infinite linear;
        }

        @keyframes rotateOne {
            from {
                transform: rotateY(0);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        @keyframes rotateTwo {
            from {
                transform: rotateX(0);
            }
            to {
                transform: rotateX(360deg);
            }
        }

        @keyframes rotateThree {
            from {
                transform: rotateZ(0);
            }
            to {
                transform: rotateZ(360deg);
            }
        }

        @keyframes rotateFour {
            from {
                transform: rotateX(0) rotateY(0) rotateZ(0);
            }
            to {
                transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="box top-left"></div>
        <div class="box top-right"></div>
        <div class="box bottom-left"></div>
        <div class="box bottom-right"></div>
    </div>
</body>
</html>
