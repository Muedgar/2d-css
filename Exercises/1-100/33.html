<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(126, 126, 255);
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .face {
            position: absolute;
            top: 100px;
            width: 200px;
            height: 250px;
            border: .75vmin solid;
            border-radius: 100% / 80% 80% 120% 120%;
        }

        .eyes {
            position: absolute;
            top: 80px;
            width: 50px;
            height: 50px;
            border: .1vmin solid;
            border-radius: 50%;
            background: radial-gradient(100% 100% at 70% 50%, black 20%, white 20%) 0 0 / 100% 100%;
        }

        .eyes.left {
            left: 20px;
        }

        .eyes.right {
            right: 20px;
        }

        .nose {
            position: absolute;
            top: 120px;
            left: 100px;
            width: 10px;
            height: 50px;
            background: black;
            clip-path: polygon(0% 0%, 100% 80%, 90% 90%, 0% 100%);
        }

        .mouth {
            position: absolute;
            top: 200px;
            left: 40px;
            width: 100px;
            height: 10px;
            border: .8vmin solid;
            border-radius: 90% 80% 90% 98% / 70% 89% 88% 98%;
        }

        .ears {
            position: absolute;
            top: 100px;
            width: 70px;
            height: 100px;
            background: rgb(126, 126, 255);
            border-radius: 100% / 80% 80% 120% 120%;
            border-top: .1vmin black solid;
            border-bottom: .1vmin black solid;
        }

        .ears.left {
            left: -50px;
            transform: rotate(-20deg);
            border-left: .6vmin black solid;
        }

        .ears.right {
            right: -50px;
            transform: rotate(20deg);
            border-right: .6vmin black solid;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="face">
            <div class="eyes left"></div>
            <div class="eyes right"></div>
            <div class="ears left"></div>
            <div class="ears right"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
        </div>
    </div>
</body>
</html>
