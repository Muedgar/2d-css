<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: absolute;
            width: 500px;
            height: 500px;
            background: lightgreen;
            left: 25%;
            top: 25%;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            left: -10%;
            top: -10%;
            width: 100px;
            height: 100px;
            background: black;
            transform: rotate(45deg);
        }

        .container::after {
            content: "";
            position: absolute;
            right: -10%;
            top: -10%;
            width: 100px;
            height: 100px;
            background: black;
            transform: rotate(45deg);
        }

        .box-1 {
            position: absolute;
            top: 30%;
            left: 20%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(80% 80% at 50% 50%, black 30%, white 30%) 0 0 / 100% 100%;
        }

        .box-2 {
            position: absolute;
            top: 30%;
            right: 20%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(80% 80% at 50% 50%, black 30%, white 30%) 0 0 / 100% 100%;
        }

        .box-3 {
            position: absolute;
            top: 55%;
            left: 10%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: pink;
        }

        .box-4 {
            position: absolute;
            top: 55%;
            right: 10%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: pink;
        }

        .box-5 {
            position: absolute;
            top: 65%;
            left: 30%;
            width: 200px;
            height: 100px;
            border-left: 0 solid;
            border-right: 0 solid;
            border-bottom: 3em solid;
            border-radius: 20% 20% 40% 50% / 30% 50% 80% 80%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box-1"></div>
        <div class="box-2"></div>
        <div class="box-3"></div>
        <div class="box-4"></div>
        <div class="box-5"></div>
    </div>
</body>
</html>
