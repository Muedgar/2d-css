
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Cards</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: antiquewhite;
            display: grid;
            place-items: center;
        }

        .container {
            position: relative;
            width: 80%;
            height: 300px;
            background: yellowgreen;
            overflow: hidden;
            perspective: 800px;
        }

        .card {
            position: absolute;
            top: 25px;
            left: 100%;

            width: 250px;
            height: 250px;
            background: brown;
            border-radius: 5px;

            display: grid;
            place-items: center;

            animation: rotateCards 9s linear infinite;
        }

        .card:nth-child(1) {
            animation-delay: -6s;
        }

        .card:nth-child(2) {
            animation-delay: -3s;
        }

        .card:nth-child(3) {
            animation-delay: 0s;
        }

        p {
            color: white;
            font-size: 3em;
            font-family: Georgia, serif;
        }

        @keyframes rotateCards {
            0% {
                left: 100%;
                transform: rotateY(0deg) rotateZ(0deg);
            }

            50% {
                transform: rotateY(180deg) rotateZ(180deg);
            }

            100% {
                left: -250px;
                transform: rotateY(360deg) rotateZ(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card"><p>1</p></div>
        <div class="card"><p>2</p></div>
        <div class="card"><p>3</p></div>
    </div>
</body>
</html>
