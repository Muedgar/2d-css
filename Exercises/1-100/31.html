<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background: rgb(120, 242, 71);
            display: grid;
            place-items: center;
        }

        .face {
            position: absolute;
            top: 40px;
            width: 500px;
            height: 500px;
            border: .75vmin solid;
            border-radius: 100% / 80% 80% 120% 120%;
            background: pink;
        }

        .face::before {
            content: "";
            position: absolute;
            top: 150px;
            width: 460px;
            height: 500px;
            border-bottom: .75vmin solid;
            border-radius: 100% / 120% 120% 80% 80%;
            transform: rotate(-30deg);
            background: pink;
        }
        
        .bangs {
            position: absolute;
            top: -30px;
            left: -25px;
            width: 550px;
            height: 220px;
            background: black;
            border-radius: 100% / 120% 120% 10% 10%;
        }

        .bangs .one {
            position: absolute;
            top: -15px;
            width: 50px;
            height: 50px;
            background: black;
            z-index: 1;
            border-radius: 50%;
            left: 45%;
        }

        .eyes {
            position: absolute;
            top: 50%;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(50% 50% at 70% 50%, black 30%, white 20%) 0 0 / 100% 100%;
        }

        .eyes.left {
            left: 15%;
        }

        .eyes.right {
            right: 15%;
        }

        .nose {
            position: absolute;
            top: 70%;
            left: 50%;
            width: 30px;
            height: 150px;
            background: rgb(242, 124, 5);
            clip-path: polygon(0% 0%, 100% 80%, 90% 85%, 0% 100%);
        }

        .mouth {
            position: absolute;
            top: 102%;
            left: 30%;
            width: 150px;
            height: 50px;
            border: 3vmin solid;
            border-radius: 80% 80% 80% 80% / 80% 80% 80% 80%;
        }

        .ears {
            position: absolute;
            top: 50%;
            width: 100px;
            height: 200px;
            background: pink;
            border-radius: 100% / 70% 70% 120% 120%;
            
        }

        .ears.left {
            left: -10%;
            transform: rotate(-15deg)
        }

        .ears.right {
            right: -10%;
            transform: rotate(15deg)
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="face">
            <div class="bangs">
                <div class="one"></div>
            </div>
            <div class="eyes left"></div>
            <div class="eyes right"></div>
            <div class="ears left"></div>
            <div class="ears right"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
        </div>
    </div>
</body>
</html>
