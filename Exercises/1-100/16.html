<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: burlywood;
        }

        .bangs {
            position: absolute;
            left: 20%;
            top: 10%;
            width: 500px;
            height: 300px;
            background: brown;
            border-radius: 100% / 120% 120% 20% 20%;
        }

        .bangs::before {
            content: "";
            position: absolute;
            top: 160px;
            left: 0;
            width: 100%;
            height: 200px;
            background: repeating-linear-gradient(to left, rgba(0, 0, 0, 0) 10px, brown 20.5px)
        }
    </style>
</head>
<body>
    <div class="bangs"></div>
</body>
</html>
