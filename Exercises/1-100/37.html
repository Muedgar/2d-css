<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(255, 249, 171);
            display: grid;
            place-items: center;
        }

        .rectangle {
            position: absolute;
            top: 10%;
            width: 350px;
            height: 100px;
            border: 1vmin solid;
        }

        .ball {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: black;
            animation: move 2s ease-in-out infinite;
        }

        @keyframes move {
            0% {
                transform: translateX(0);
            }
            10% {
                transform: translateX(100%) translateY(100%);
            }
        }
    </style>
</head>
<body>
    <div class="rectangle">
        <div class="ball"></div>
    </div>
</body>
</html>
