<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(181, 181, 255);
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            display: grid;
            place-items: center;
        }

        .neck {
            position: absolute;
            top: 40px;
            width: 40px;
            height: 100px;
            background: black;
            border-radius: 100% / 0% 0% 100% 100%;
            box-shadow: 0px 50px #333;
        }

        .shoulders {
            position: absolute;
            top: 140px;
            width: 200px;
            height: 50px;
            background: black;
            border-radius: 100% / 200% 200% 0% 0%;
        }

        .arms {
            position: absolute;
            top: 40px;
            width: 20px;
            height: 100px;
            background: black;
        }

        .arms.left {
            left: 0px;
            transform: rotate(5deg);
        }

        .arms.right {
            right: 0px;
            transform: rotate(-5deg);
        }

        .arms.l-hand {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="neck"></div>
        <div class="shoulders">
            <div class="arms left l-hand"></div>
            <div class="arms right r-hand"></div>
        </div>
        <div class="legs left"></div>
        <div class="legs right"></div>
    </div>
</body>
</html>
