<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(172, 242, 255);
        }

        .rectangle {
            width: 0px;
            height: 50px;
            background: black;
        }

        .one {
            animation: grow 500ms infinite 0ms;
        }

        .two {
            animation: grow 600ms infinite 1ms;
        }

        .three {
            animation: grow 700ms infinite 2ms;
        }

        .four {
            animation: grow 800ms infinite 3ms;
        }

        .five {
            animation: grow 900ms infinite 4ms;
        }

        @keyframes grow {
            0% {
                width: 0;
            }

            50% {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="rectangle one"></div>
    <div class="rectangle two"></div>
    <div class="rectangle three"></div>
    <div class="rectangle four"></div>
    <div class="rectangle five"></div>
</body>
</html>
