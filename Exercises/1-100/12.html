<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background: rgb(255, 201, 255);
            display: grid;
            place-items: center;
        }

        .face {
            width: 400px;
            height: 500px;
            border-radius: 100% / 80% 80% 125% 125%;
            border: .2vmin solid;
            box-shadow: 0px 0px, -2px 2px, 2px -2px, 1px 1px black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="face">
            
        </div>
    </div>
</body>
</html>
