<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(239, 160, 255);
        }

        .box {
            position: absolute;
            width: 50px;
            height: 50px;
            background: black;
            border-radius: 50%;
            
        }

        .box:nth-child(1) {
            animation: bounce 200ms infinite ease-out;
        }

        .box:nth-child(2) {
            left: 50px;
            animation: bounce 300ms infinite ease-out;
        }

        .box:nth-child(3) {
            left: 100px;
            animation: bounce 400ms infinite ease-out;
        }

        .box:nth-child(4) {
            left: 150px;
            animation: bounce 500ms infinite ease-out;
        }

        .box:nth-child(5) {
            left: 200px;
            animation: bounce 600ms infinite ease-out;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(100px);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</body>
</html>
