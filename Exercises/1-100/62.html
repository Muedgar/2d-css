
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cube Cut Into Pieces</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #2805;
        display: grid;
        place-items: center;
        perspective: 900px;
    }

    .scene {
        position: relative;
        width: 100px;
        height: 100px;
        transform-style: preserve-3d;
        animation: rotateCube 8s linear infinite;
    }

    .piece {
        position: absolute;
        width: 50px;
        height: 50px;
        transform-style: preserve-3d;
        animation: separate 3s ease-in-out infinite alternate;
    }

    .face {
        position: absolute;
        width: 50px;
        height: 50px;
        border: 1px solid #222;
        background: #499;
        opacity: 0.95;
    }

    .face:nth-child(1) {
        transform: translateZ(25px);
    }

    .face:nth-child(2) {
        transform: rotateY(180deg) translateZ(25px);
    }

    .face:nth-child(3) {
        transform: rotateY(90deg) translateZ(25px);
    }

    .face:nth-child(4) {
        transform: rotateY(-90deg) translateZ(25px);
    }

    .face:nth-child(5) {
        transform: rotateX(90deg) translateZ(25px);
    }

    .face:nth-child(6) {
        transform: rotateX(-90deg) translateZ(25px);
    }

    .piece:nth-child(1) {
        --x: -25px; --y: -25px; --z: 25px;
    }
    .piece:nth-child(2) {
        --x: 25px; --y: -25px; --z: 25px;
    }
    .piece:nth-child(3) {
        --x: -25px; --y: 25px; --z: 25px;
    }
    .piece:nth-child(4) {
        --x: 25px; --y: 25px; --z: 25px;
    }
    .piece:nth-child(5) {
        --x: -25px; --y: -25px; --z: -25px;
    }
    .piece:nth-child(6) {
        --x: 25px; --y: -25px; --z: -25px;
    }
    .piece:nth-child(7) {
        --x: -25px; --y: 25px; --z: -25px;
    }
    .piece:nth-child(8) {
        --x: 25px; --y: 25px; --z: -25px;
    }

    @keyframes separate {
        from {
            transform:
                translate3d(
                    calc(25px + var(--x)),
                    calc(25px + var(--y)),
                    var(--z)
                );
        }

        to {
            transform:
                translate3d(
                    calc(25px + var(--x) * 2),
                    calc(25px + var(--y) * 2),
                    calc(var(--z) * 2)
                );
        }
    }

    @keyframes rotateCube {
        from {
            transform: rotateX(-25deg) rotateY(0deg);
        }

        to {
            transform: rotateX(-25deg) rotateY(360deg);
        }
    }
</style>
</head>
<body>
    <div class="scene">
        <!-- Each piece is a complete small cube -->
        <div class="piece">
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
        </div>
        <div class="piece">
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
        </div>
        <div class="piece">
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
        </div>
        <div class="piece">
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
        </div>
        <div class="piece">
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
        </div>
        <div class="piece">
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
        </div>
        <div class="piece">
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
        </div>
        <div class="piece">
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
            <div class="face"></div><div class="face"></div>
        </div>
    </div>
</body>
</html>
