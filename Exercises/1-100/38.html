<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(165, 255, 220);
            display: grid;
            place-items: center;
        }

        .face {
            position: absolute;
            top: 10%;
            width: 300px;
            height: 300px;
            border-radius: 100% / 80% 80% 120% 120%;
            background: pink;
        }

        .eyes {
            position: absolute;
            width: 50px;
            height: 50px;
            border: .1vmin solid;
            border-radius: 50%;
            background: radial-gradient(100% 100% at 70% 50%, black 20%, white 20%) 0 0 / 100% 100%;
        }

        .eyes.left {
            top: 35%;
            left: 20%;
        }

        .eyes.right {
            top: 35%;
            right: 20%;
        }

        .nose {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 50px;
            background: rgb(84, 82, 0);
            clip-path: polygon(0% 0%, 100% 80%, 80% 90%, 0% 100%, 0% 0%);
        }

        .mouth {
            position: absolute;
            bottom: 15%;
            left: 35%;
            width: 100px;
            height: 20px;
            border-radius: 120% 120% 140% 130% / 120% 120% 140% 130%;
            background: red;
        }

        .neck {
            position: absolute;
            bottom: -30%;
            left: 39%;
            width: 70px;
            height: 100px;
            background: pink;
        }

        .shoulders {
            position: absolute;
            bottom: -50%;
            width: 300px;
            height: 70px;
            background: pink;
            border-radius: 100% 100% 0 0 / 100% 100% 0 0;
        }

        .ears {
            position: absolute;
            top: 120px;
            width: 70px;
            height: 100px;
            background: pink;
            border-radius: 100% / 80% 80% 120% 120%;
        }

        .ears.left {
            left: -20px;
            transform: rotate(-20deg);
        }

        .ears.right {
            right: -20px;
            transform: rotate(20deg);
        }

        .cap {
            position: absolute;
            left: -5px;
            width: 310px;
            height: 100px;
            background: brown;
            border-radius: 100% 100% 0 0 / 100% 100% 0 0;
        }
        
        .cap::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 40%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="face">
        <div class="eyes left"></div>
        <div class="eyes right"></div>
        <div class="nose"></div>
        <div class="ears left"></div>
        <div class="ears right"></div>
        <div class="mouth"></div>
        <div class="neck"></div>
        <div class="shoulders"></div>
        <div class="bangs"></div>
        <div class="cap"></div>
    </div>
</body>
</html>
