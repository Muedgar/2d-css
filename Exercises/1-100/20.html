<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: burlywood;
            display: grid;
            place-items: center;
            transform-style: preserve-3d;
            perspective: 90em;
        }

        .container {
            width: 100px;
            height: 150px;
            transform-style: preserve-3d;
            perspective: 90em;
            margin-top: 300px;
            animation: rotate 10s infinite;
        }

        .box {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 0;
            background: black;
            transform: rotateX(90deg);
            transform-style: preserve-3d;
            perspective: 90em;
        }

        .faces {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .one {
            background: green;
            transform: rotateX(90deg) rotateY(90deg) translateZ(50px) translateY(50px)
        }

        .two {
            background: blue;
            transform: rotateX(90deg) rotateY(-90deg) translateZ(50px) translateY(50px)
        }

        .three {
            background: red;
            transform: rotateY(0deg) rotateX(90deg) translateZ(50px) translateY(50px)
        }

        .four {
            background: yellow;
            transform: translateZ(125px) translateY(25px);
            width: 100px;
            height: 100px;
        }

        .five {
            background: pink;
            transform: rotateY(0deg) rotateX(90deg) translateZ(-50px) translateY(50px)
        }

        @keyframes rotate {
            0% {
                transform: rotate(0);
            }

            100% {
                transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
        <div class="faces one"></div>
        <div class="faces two"></div>
        <div class="faces three"></div>
        <div class="faces four"></div>
        <div class="faces five"></div>
        <div class="faces six"></div>
    </div>
    </div>
</body>
</html>
