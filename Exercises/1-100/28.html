<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(20% 20% at 90% 90%, blue 20%, yellow 20%) 0% 0% / 100% 100%;
        }

        .box {
            width: 200px;
            height: 200px;
            background: black;
            transform-style: preserve-3d;
            perspective: 100em;
            margin: 30% auto;
            transform: rotateY(10deg);
        }

        .face {
            width: 200px;
            height: 200px;
            background: red;
        }

        .one {
            transform: rotateX(80deg) translateZ(-100px) translateY(100px)
        }

        .two {
            position: absolute;
            background: blue;
            transform: rotateX(-10deg) rotateY(90deg) translateZ(100px) translateX(-100px) translateY(-200px);
        }

        .three {
            position: absolute;
            top: 0;
            background: green;
            transform: rotateY(90deg) translateZ(-100px) rotateZ(-10deg) translateX(-100px);
        }

        .four {
            position: absolute;
            bottom: 0;
            background: white;
            transform: translateZ(250px) rotateX(-10deg) translateY(30px);
        }

        .five {
            z-index: 1;
            background: purple;
            transform: rotateX(90deg) translateY(100px) translateZ(300px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="face one"></div>
            <div class="face two"></div>
            <div class="face three"></div>
            <div class="face four"></div>
            <div class="face five"></div>
            <div class="six"></div>
        </div>
    </div>
</body>
</html>
