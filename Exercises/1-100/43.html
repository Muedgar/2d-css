<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(201, 255, 163);
            display: grid;
            place-items: center;
        }

        .nose {
            position: absolute;
            top: 10%;
            width: 20px;
            height: 100px;
            background: black;
            clip-path: polygon(0% 0%, 100% 80%, 80% 90%, 0% 90%, 0% 0%);
        }
    </style>
</head>
<body>
    <div class="nose"></div>
</body>
</html>
