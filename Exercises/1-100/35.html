<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .solid-red-square {
            width: 100px;
            height: 100px;
            background-color: red;
        }

        .blue-rectangle {
            width: 300px;
            height: 100px;
            background-color: blue;
        }

        .perfect-circle {
            width: 100px;
            height: 100px;
            background: peru;
            border-radius: 50%;
        }

        .ellipse {
            width: 250px;
            height: 100px;
            background: black;
            border-radius: 180% 180% 180% 180% / 180% 180% 180% 180%;
        }

        .rectangle-with-rounded-corners {
            width: 300px;
            height: 100px;
            background-color: purple;
            border-radius: 20px;
        }

        .pill-shaped-capsule {
            width: 20px;
            height: 100px;
            background: linear-gradient(to bottom, black 50%, orange 50%);
            border-radius: 10px;
        }

        .hollow-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border-top: .5vmin solid;
            border-bottom: .5vmin solid;
        }
    </style>
</head>
<body>
    <!-- Draw a solid red square. -->
    <div class="solid-red-square"></div>

    <!-- Draw a blue rectangle. -->
    <div class="blue-rectangle"></div>
    
    <!-- Draw a perfect circle. -->
    <div class="perfect-circle"></div>

    <!-- Draw an ellipse. -->
    <div class="ellipse"></div>

    <!-- Draw a rectangle with rounded corners. -->
    <div class="rectangle-with-rounded-corners"></div>

    <!-- Draw a pill-shaped capsule. -->
    <div class="pill-shaped-capsule"></div>

    <!-- Draw a hollow circle using borders. -->
    <div class="hollow-circle"></div>
</body>
