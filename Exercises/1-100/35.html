
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .solid-red-square {
            width: 100px;
            height: 100px;
            background-color: red;
        }

        .blue-rectangle {
            width: 300px;
            height: 100px;
            background-color: blue;
        }

        .perfect-circle {
            width: 100px;
            height: 100px;
            background: peru;
            border-radius: 50%;
        }

        .ellipse {
            width: 250px;
            height: 100px;
            background: black;
            border-radius: 180% 180% 180% 180% / 180% 180% 180% 180%;
        }

        .rectangle-with-rounded-corners {
            width: 300px;
            height: 100px;
            background-color: purple;
            border-radius: 20px;
        }

        .pill-shaped-capsule {
            width: 20px;
            height: 100px;
            background: linear-gradient(to bottom, black 50%, orange 50%);
            border-radius: 10px;
        }

        .hollow-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border-top: .5vmin solid;
            border-bottom: .5vmin solid;
        }

        .circle-inside {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: .54vmin solid;
            background: radial-gradient(100% 100% at 50% 50%, black 40%, yellow 10%) 0 0 / 100% 100%;
        }

        .three-circle-overlapping-circles {
            width: 100px;
            height: 100px;
            border: 1vmin solid;
            border-radius: 50%;
            position: absolute;
        }

        .three-circle-overlapping-circles::before {
            content: "";
            width: 100px;
            height: 100px;
            border: 1vmin solid;
            border-radius: 50%;
            position: absolute;
            left: 50px;
        }

        .three-circle-overlapping-circles::after {
            content: "";
            width: 100px;
            height: 100px;
            border: 1vmin solid;
            border-radius: 50%;
            position: absolute;
            top: 50px;
            left: 20px;
        }

        .semicircle {
            width: 100px;
            height: 100px;
            background: black;
            border-radius: 50%;
            clip-path: polygon(0% 50%, 100% 50%, 100% 100%, 0% 100%);
            transform: rotate(180deg);
        }

        .quarter-circle {
            width: 100px;
            height: 100px;
            background: black;
            border-radius: 50%;
            clip-path: polygon(0% 50%, 50% 50%, 50% 100%, 0% 100%);
            transform: rotate(90deg);
        }

        .triangle {
            width: 100px;
            height: 100px;
            background: black;
            border-radius: 100% 0 0 0 / 100% 0 0 0;
            border-left: 10px solid yellow;
        }

        .equilateral-triangle {
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: green;
            z-index: 20;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%, 50% 0%);
        }

        .diamond {
            position: absolute;
            top: 200px;
            right: 30px;
            width: 100px;
            height: 100px;
            background: red;
            transform-style: preserve-3d;
            perspective: 80em;
            transform: scaleY(1.4) rotateZ(45deg);
        }

        .parallelogram {
            position: absolute;
            top: 400px;
            right: 30px;
            width: 140px;
            height: 100px;
            background: black;
            transform-style: preserve-3d;
            perspective: 80em;
            transform: skewX(3);
        }

        .trapezoid {
            position: absolute;
            top: 550px;
            right: 30px;
            width: 200px;
            height: 80px;
            background: blue;
            clip-path: polygon(0% 100%, 10% 0%, 90% 0, 100% 100%, 0% 100%);
        }

        .hexagon {
            position: absolute;
            top: 650px;
            right: 30px;
            width: 100px;
            height: 100px;
            background: black;
            clip-path: polygon(0% 50%, 20% 0%, 80% 0%, 100% 50%, 80% 100%, 20% 100%, 0% 50%);
        }

        .five-star {
            position: absolute;
            top: 800px;
            right: 30px;
            width: 100px;
            height: 100px;
            background: black;
            clip-path: polygon(0% 50%, 40% 40%, 50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%);
        }

        .crescent-moon {
            position: absolute;
            top: 900px;
            right: 30px;
            border-right: 1vmin solid;
            width: 100px;
            height: 100px;
            border-radius: 100%;
            transform: rotate(40deg);
        }

        .simple-heart {
            position: absolute;
            top: 1000px;
            right: 30px;
            width: 50px;
            height: 100px;
            border: .24vmin solid;
            border-radius: 100% 100% 100% 0% / 100% 100% 100% 0%;
            transform: rotate(10deg)
        }

        .simple-heart::after {
            content: "";
            position: absolute;
            top: 0;
            right: 30px;
            width: 50px;
            height: 100px;
            border: .24vmin solid;
            border-radius: 0% 100% 100% 100% / 0% 100% 100% 100%;
        }
    </style>
</head>
<body>
    <!-- Draw a solid red square. -->
    <div class="solid-red-square"></div>

    <!-- Draw a blue rectangle. -->
    <div class="blue-rectangle"></div>
    
    <!-- Draw a perfect circle. -->
    <div class="perfect-circle"></div>

    <!-- Draw an ellipse. -->
    <div class="ellipse"></div>

    <!-- Draw a rectangle with rounded corners. -->
    <div class="rectangle-with-rounded-corners"></div>

    <!-- Draw a pill-shaped capsule. -->
    <div class="pill-shaped-capsule"></div>

    <!-- Draw a hollow circle using borders. -->
    <div class="hollow-circle"></div>

    <!-- Draw a circle inside another circle. -->
    <div class="circle-inside"></div>
    <!-- Draw three overlapping circles. -->
    <div class="three-circle-overlapping-circles"></div>
    <!-- Draw a semicircle. -->
     <div class="semicircle"></div>
    <!-- Draw a quarter circle. -->
     <div class="quarter-circle"></div>
    <!-- Draw a triangle using CSS borders. -->
     <div class="triangle"></div>
    <!-- Draw an equilateral triangle using clip-path. -->
     <div class="equilateral-triangle"></div>
    <!-- Draw a diamond. -->
     <div class="diamond"></div>
    <!-- Draw a parallelogram. -->
     <div class="parallelogram"></div>
    <!-- Draw a trapezoid. -->
     <div class="trapezoid"></div>
    <!-- Draw a regular hexagon. -->
     <div class="hexagon"></div>
    <!-- Draw a five-pointed star. -->
     <div class="five-star"></div>
    <!-- Draw a crescent moon. -->
     <div class="crescent-moon"></div>
    <!-- Draw a simple heart. -->
     <div class="simple-heart"></div>

</body>
</html>
