<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(207, 140, 255);
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 300px;
            border: .75vmin solid;
            border-radius: 100% / 80% 80% 120% 120%;
        }

        .eyes {
            position: absolute;
            top: 80px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(100% 100% at 60% 50%, black 20%, white 20%) 0 0 / 100% 100%;
        }

        .eyes.left {
            left: 25px;
        }

        .eyes.right {
            right: 25px;
        }

        .ears {
            position: absolute;
            width: 70px;
            height: 100px;
            background: black;
        }

        .ears.left {
            left: -50px;
            top: 90px;
            transform: rotate(-15deg);
            border-radius: 100% / 120% 50% 100% 80%;
        }
        
        .ears.right {
            right: -50px;
            top: 90px;
            transform: rotate(15deg);
            border-radius: 100% / 100% 80% 120% 50%;
        }

        .nose {
            position: absolute;
            top: 140px;
            left: 100px;
            width: 10px;
            height: 60px;
            background: black;
            clip-path: polygon(0% 0%, 100% 80%, 90% 90%, 0% 100%);
        }

        .mouth {
            position: absolute;
            bottom: 50px;
            left: 60px;
            width: 70px;
            height: 10px;
            border: .75vmin solid;
            border-radius: 90% 38% 93% 39% / 19% 39% 30% 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="face">
            <div class="eyes left"></div>
            <div class="eyes right"></div>
            <div class="ears left"></div>
            <div class="ears right"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
        </div>
    </div>
</body>
</html>
