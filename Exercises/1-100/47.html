<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgb(221, 133, 255);
            display: grid;
            place-items: center;
        }

        .gridz {
            position: absolute;
            top: 20%;
            width: 400px;
            height: 400px;
            background: 
             repeating-linear-gradient(to left, rgba(0, 0, 0, 0.108) 10% 20%, rgba(255, 255, 255, 0.193) 20.1% 30%),
             repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.108) 10% 20%, rgba(255, 255, 255, 0.193) 20.1% 30%);
        }
    </style>
</head>
<body>
    <div class="gridz"></div>
</body>
</html>
