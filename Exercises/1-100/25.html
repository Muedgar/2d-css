
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Mouth</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: white;
    }

    .container {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
    }

    .mouth {
        position: relative;
        width: 330px;
        height: 180px;
        background: #f45e5b;
        border-radius: 50% 50% 50% 50% / 40% 40% 90% 90%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Dark inside of the mouth */
    .mouth .inside {
        position: absolute;
        width: 94%;
        height: 70%;
        top: 16%;
        background: #705545;
        border-radius: 50% 50% 50% 50% / 30% 30% 90% 90%;
        overflow: hidden;
    }

    /* Upper teeth */
    .mouth .upper-teeth {
        position: absolute;
        top: 16%;
        left: 7%;
        width: 86%;
        height: 25%;
        background: #f5f5f5;
        border-radius: 25% 25% 15% 15% / 60% 60% 25% 25%;
        box-shadow: 0 5px 0 #c8c8c8;
        z-index: 3;
    }

    /* Lower teeth */
    .mouth .lower-teeth {
        position: absolute;
        bottom: 22%;
        left: 12%;
        width: 76%;
        height: 22%;
        background: white;
        border-radius: 15% 15% 50% 50% / 20% 20% 80% 80%;
        z-index: 2;
    }

    /* Tongue */
    .mouth .tongue {
        position: absolute;
        bottom: 32%;
        left: 30%;
        width: 40%;
        height: 22%;
        background: #f17e7b;
        border-radius: 60% 60% 20% 20% / 100% 100% 20% 20%;
        z-index: 1;
    }

    /* Mouth corner lines */
    .mouth::before,
    .mouth::after {
        content: "";
        position: absolute;
        top: 18%;
        width: 10px;
        height: 35px;
        border-radius: 50%;
        border-left: 7px solid #705545;
    }

    .mouth::before {
        left: -10px;
        transform: rotate(15deg);
    }

    .mouth::after {
        right: -10px;
        transform: rotate(165deg);
    }
</style>
</head>
<body>
    <div class="container">
        <div class="mouth">
            <div class="inside"></div>
            <div class="tongue"></div>
            <div class="upper-teeth"></div>
            <div class="lower-teeth"></div>
        </div>
    </div>
</body>
</html>
