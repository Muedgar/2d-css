<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(190% 300% at 50% 50%, rgb(151, 48, 48) 40%, white 40%) 0% 0% / 100% 100%;
            display: grid;
            place-items: center;
            perspective: 80em;
        }

        .box {
            transform-style: preserve-3d;
            width: 300px;
            height: 300px;
            background: green;
            box-shadow: 0px 10px 10px 10px black;
            transform: rotateX(80deg);
            position: absolute;
        }

        .one {
            transform: rotateX(0) rotateY(80deg) translateY(-150px) translateX(-450px);
            background: yellow;
        }

        .two {
            background: black;
            transform: rotateX(0) rotateY(-80deg) translateX(30px);
        }

        .three {
            background: blue;
            transform: rotateX(0) rotateY(-80deg) translateZ(-150px);
        }

        .four {
            background: purple;
            transform: rotateX(0) rotateY(80deg) translateZ(-150px);
        }

        .five {
            background: red;
            transform: rotateX(-80deg) translateY(-800px);
        }

        .six {
            background: skyblue;
            transform: rotateX(80deg) translateY(800px);
        }

        .seven {
            background: fuchsia;
            transform: rotateY(80deg) translateZ(-400px) scale(2);
        }

        .eight {
            background: aqua;
            transform: rotateY(-80deg) translateZ(-400px) scale(2);
        }

        .nine {
            background: darkcyan;
            transform: rotateX(0) scale(1.2);
            box-shadow: 0px 0px 100px 100px black;
        }

        .ten {
            background: darkblue;
            transform: rotateX(0) scale(1.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box one"></div>
        <div class="box two"></div>
        <div class="box three"></div>
        <div class="box four"></div>
        <div class="box five"></div>
        <div class="box six"></div>
        <div class="box seven"></div>
        <div class="box eight"></div>
        <div class="box nine"></div>
        <div class="box ten"></div>
    </div>
</body>
</html>
