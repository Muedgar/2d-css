<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: beige;
        }

        .container {
            position: absolute;
            top: 0;
            background: black;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .box {
            position: absolute;
            width: 400px;
            height: 400px;
            display: grid;
            place-items: center;
            background: transparent;
            transform-style: preserve-3d;
            perspective: 80em;
            animation: rotate 10s infinite;
        }

        .face {
            position: absolute;
            width: 300px;
            height: 300px;
            background-color: yellow;
            transform: rotateX(80deg) rotateY(0deg) rotateZ(0deg);
        }

        .one {
            background: green;
            transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) translateY(-150px) translateZ(-150px);
        }

        .two {
            background: blue;
            transform: rotateX(0deg) rotateY(90deg) rotateZ(0deg) translateY(-150px) translateZ(150px);
        }

        .three {
            background: olive;
            transform: rotateX(0deg) rotateY(80deg) rotateZ(-90deg) translateX(150px) translateZ(-140px);
        }

        .four {
            background: fuchsia;
            transform: translateY(-300px) rotateX(80deg) rotateY(0deg) rotateZ(0deg);
        }

        .five {
            background: red;
            transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) translateY(-150px) translateZ(150px);
        }

        @keyframes rotate {
            0% {
                transform: rotateY(0);
            }

            100% {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="face one"></div>
            <div class="face two"></div>
            <div class="face three"></div>
            <div class="face four"></div>
            <div class="face five"></div>
            <div class="face six"></div>
        </div>
    </div>
</body>
</html>
