<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background: black;
            display: grid;
            place-items: center;
            transform-style: preserve-3d;
            perspective: 90em;
        }

        .box {
            background: white;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            perspective: 90em;
        }

        .face {
            position: absolute;
            top: 20%;
            width: 200px;
            height: 200px;
            background: blue;
            transform: rotateY(90deg);
        }

        .two {
            animation: two infinite 3s ease-in-out;
        }

        @keyframes two {
            0% {
                transform: rotateY(90deg) translateZ(0);
            }

            100% {
                transform: rotateY(90deg) translateZ(100px);
            }
        }

        .three {
            background: green;
            animation: three infinite 6s ease-in-out;
        }

        @keyframes three {
            0% {
                transform: rotateY(90deg) translateZ(0);
            }

            100% {
                transform: rotateY(90deg) translateZ(100px);
            }
        }

        .four {
            background: yellow;
            animation: four infinite 9s ease-in-out;
        }

        @keyframes four {
            0% {
                transform: rotateY(90deg) translateZ(0);
            }

            100% {
                transform: rotateY(90deg) translateZ(100px);
            }
        }

        .five {
            background: red;
            animation: five infinite 12s ease-in-out;
        }

        @keyframes five {
            0% {
                transform: rotateY(90deg) translateZ(0);
            }

            100% {
                transform: rotateY(90deg) translateZ(100px);
            }
        }

        .six {
            background: orange;
            animation: six infinite 15s ease-in-out;
        }

        @keyframes six {
            0% {
                transform: rotateY(90deg) translateZ(0);
            }

            100% {
                transform: rotateY(90deg) translateZ(100px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="face one"></div>
            <div class="face two"></div>
            <div class="face three"></div>
            <div class="face four"></div>
            <div class="face five"></div>
            <div class="face six"></div>
        </div>
    </div>
</body>
</html>
