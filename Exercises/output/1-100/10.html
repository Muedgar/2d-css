<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: 
                linear-gradient(to left, blue 20%, black 20% 40%, yellow 40% 10%)
            ;
            /* animation: container_background 6s infinite ease-in-out;; */
        }
        .box {
            width: 200px;
            height: 200px;
            background: black;
            clip-path: circle();
            animation: roll 6s infinite ease-in-out;
            position: absolute;
        }

        .box::before {
            content: "";
            position: absolute;
            top: 20%;
            left: 20%;
            background: red;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .one {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(10% 20% at 100% 100%, rgba(0, 0, 255, 0.475) 40%, rgba(255, 255, 0, 0.379) 41%) 0% 0% / 100% 100%;
        }

        @keyframes roll {
            0% {
                transform: translateX(0)
            }

            50% {
                transform: translateX(500px) rotate(90deg)
            }

            75% {
                transform: translateX(500px) translateY(500px) rotate(180deg)
            }

            100% {
                transform: translateX(0) translateY(500px) rotate(270deg)
            }
        }

        @keyframes container_background {
            0% {
                background: 
                linear-gradient(to left, blue 20%, black 20% 40%, yellow 40% 10%)
            ;
            }

            50% {
                background: 
                linear-gradient(to left, blue 30%, black 30% 50%, yellow 500px 20%)
            ;
            }

            75% {
                background: 
                linear-gradient(to left, blue 40%, black 40% 60%, yellow 500px 30%)
            }

            100% {
                transform: translateX(0) translateY(500px) rotate(270deg)
            }
        }

        .two {
            position: absolute;
            top: 20%;
            left: 40%;
            width: 200px; 
            height: 200px;
            background: radial-gradient(100% 100% at 70% 50%, black 10%, white 10%) 0% 0% / 100% 100%;
            border-radius: 50%;
            z-index: 1;
        }

        .three {
            position: absolute;
            top: 20%;
            left: 63%;
            width: 200px; 
            height: 200px;
            background: radial-gradient(100% 100% at 70% 50%, black 10%, white 10%) 0% 0% / 100% 100%;
            border-radius: 50%;
            z-index: 1;
        }

        .four {
            position: absolute;
            top: 10%;
            left: 35%;
            width: 500px;
            height: 500px;
            background: yellowgreen;
            border-radius: 100% / 80% 80% 120% 120%;
        }

        .five {
            position: absolute;
            top: 30%;
            left: 35%;
            width: 500px;
            height: 500px;
            background: yellowgreen;
            border-radius: 100% / 120% 120% 80% 80%;
            transform: rotate(-20deg);
        }

        .six {
            position: absolute;
            top: 62.5%;
            left: 55%;
            width: 200px;
            height: 20px;
            background: red;
            border-radius:  100% 100% 100% 100% / 200%;
        }

        .six::before {
            content: "";
            position: absolute;
            left: 25%;
            top: 10px;
            background: white;
            width: 100px;
            height: 2px;
        }

        .seven {
            position: absolute;
            left: 62%;
            top: 45%;
            width: 20px;
            height: 100px;
            background: rgb(138, 138, 5);
        }

        .seven::before {
            content: "";
            position: absolute;
            bottom: -2%;
            left: 4px;
            width: 30px;
            height: 30px;
            background: rgb(138, 138, 5);
            border-radius: 50%;
        }

        .seven::after {
            content: "";
            position: absolute;
            bottom: -2%;
            right: 4px;
            width: 30px;
            height: 30px;
            background: rgb(138, 138, 5);
            border-radius: 50%;
        }

        .eight {
            position: absolute;
            top: 35%;
            left: 30%;
            width: 200px;
            height: 200px;
            background: yellowgreen;
            border-radius: 200% /280% 20% 220% 300%;
        }

        .nine {
            position: absolute;
            top: 35%;
            left: 70%;
            width: 200px;
            height: 200px;
            background: yellowgreen;
            border-radius: 200% /280% 200% 320% 30%;
        }

        .ten {
            position: absolute;
            bottom: 0;
            left: 52.5%;
            width: 200px;
            height: 300px;
            background: yellowgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="one"></div>
        </div>
        <div class="two"></div>
        <div class="three"></div>
        <div class="four"></div>
        <div class="five"></div>
        <div class="six"></div>
        <div class="seven"></div>
        <div class="eight"></div>
        <div class="nine"></div>
        <div class="ten"></div>
    </div>
</body>
</html>
