<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: cadetblue;
        }

        .container {
            width: 100vw;
            height: 100vh;
            transform-style: preserve-3d;
            perspective: 90em;
            display: grid;
            place-items: center;
        }

        .box {
            position: absolute;
            transform-style: preserve-3d;
            animation: rotate 10s infinite;
        }

        .face {
            position: absolute;
            top: 0;
            width: 200px;
            height: 200px;
            background-color: black;
            transform: rotateX(90deg) rotateZ(90deg);
        }

        .one {
            background-color: blue;
            transform: rotateX(90deg) rotateZ(90deg) rotateY(90deg) translateX(-100px) translateZ(100px);
        }

        .two {
            background-color:chocolate;
            transform: rotateX(90deg) rotateZ(90deg) rotateY(90deg) translateX(-100px) translateZ(-100px);
        }

        .three {
            background-color:green;
            transform: rotateX(90deg) rotateZ(90deg) translateZ(200px);
        }

        .four {
            background-color:yellow;
            transform: rotateX(0) rotateZ(0) rotateY(90deg) translateZ(100px) translateY(-100px);
        }

        .five {
            transform: rotateX(0) rotateZ(0) rotateY(90deg) translateZ(-100px) translateY(-100px);
        }


        @keyframes rotate {
            0% {
                transform: rotateY(0)
            }

            100% {
                transform: rotateX(20deg) rotateY(360deg) rotateZ(20deg)
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="face one"></div>
            <div class="face two"></div>
            <div class="face three"></div>
            <div class="face four"></div>
            <div class="face five"></div>
            <div class="face six"></div>
        </div>
    </div>
</body>
</html>
