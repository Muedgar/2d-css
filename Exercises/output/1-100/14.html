<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: rgba(128, 255, 0, 0.421);
        }


        .container {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            transform-style: preserve-3d;
            perspective: 80em;
        }

        .face {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: rgba(169, 98, 5, 0.113);
            clip-path: polygon(0% 0, 100% 0%,100% 100%, 0% 50%);
        }

        .one {
            background-color: blue;
            transform: rotateX(10deg) rotateY(20deg) rotateZ(90deg);
        }

        .two {
            background: red;
            transform: rotateX(20deg) translateX(20px) rotateY(80deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="face one"></div>
            <div class="face two"></div>
            <div class="face three"></div>
            <div class="face four"></div>
            <div class="face five"></div>
            <div class="face six"></div>
        </div>
    </div>
</body>
</html>
