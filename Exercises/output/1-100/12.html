<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: cadetblue;
            font-size: 2em;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: bolder;
        }

        .container {
            width: 100vw;
            height: 100vh;
            transform-style: preserve-3d;
            perspective: 90em;
            display: grid;
            place-items: center;
        }

        .box {
            position: absolute;
            transform-style: preserve-3d;
            animation: rotate 10s infinite;
        }

        .face {
            position: absolute;
            top: 0;
            width: 200px;
            height: 200px;
            background-color: black;
            transform: rotateX(90deg) rotateZ(90deg);
        }

        .one {
            background-color: blue;
            transform: rotateX(90deg) rotateZ(90deg) rotateY(90deg) translateX(-100px) translateZ(100px);
        }

        .one::before {
            content: "Face 1";
            color: black;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: blue;
            display: grid;
            place-items: center;
        }

        .two {
            background-color:chocolate;
            transform: rotateX(-90deg) rotateZ(90deg) rotateY(-90deg) translateX(-100px) translateZ(-100px);
        }

        .two::before {
            content: "Face 2";
            color: black;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: chocolate;
            display: grid;
            place-items: center;
        }

        .three {
            background-color:green;
            transform: rotateX(90deg) rotateZ(90deg) translateZ(200px);
        }

        .three::before {
            content: "Face 3";
            color: black;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: green;
            display: grid;
            place-items: center;
        }

        .four {
            background-color:yellow;
            transform: rotateX(0) rotateZ(0) rotateY(90deg) translateZ(100px) translateY(-100px);
        }

.four::before {
            content: "Face 4";
            color: black;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: yellow;
            display: grid;
            place-items: center;
        }

        .five {
            transform: rotateX(0) rotateZ(0) rotateY(90deg) translateZ(-100px) translateY(-100px);
        }

        .five::before {
            content: "Face 5";
            color: black;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: red;
            display: grid;
            place-items: center;
        }

        .six::before {
            content: "Face 6";
            color: black;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(10, 153, 161);
            display: grid;
            place-items: center;
        }


        @keyframes rotate {
            0% {
                transform: rotateY(0)
            }

            100% {
                transform: rotateX(40deg) rotateY(360deg) rotateZ(40deg)
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="face one"></div>
            <div class="face two"></div>
            <div class="face three"></div>
            <div class="face four"></div>
            <div class="face five"></div>
            <div class="face six"></div>
        </div>
    </div>
</body>
</html>
