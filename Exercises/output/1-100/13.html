<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: grid;
            place-items: center;
            background-color: beige;
            transform-style: preserve-3d;
        }

        .container {
            position: absolute;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            transform-style: preserve-3d;
            perspective: 80em;
            display: grid;
            place-items: center;
        }        

        .box {
            width: 80%;
            height: 40%;
            background-color: rgb(255, 255, 255);
            transform: rotateX(40deg);
            transform-style: preserve-3d;
        }

        .face {
            width: 100%;
            height: 50%;
            background-color: yellow;
            transform: rotateX(40deg) rotateZ(90deg) translateY(-300px);
        }

        .one {
            transform: rotateX(40deg) rotateZ(0deg) translateZ(0);
        }

        .two {
            background: green;
            transform: rotateZ(90deg) rotateX(80deg) translateZ(200px);
        }

        .three {
            background: red;
            transform: rotateZ(270deg) rotateX(80deg) translateZ(200px);
        }

        .four {
            background:darkolivegreen;
            transform: rotateZ(90deg) rotateY(90deg) translateZ(-300px);
            animation: leftToRight 3s infinite;
        }

        .five {
            background: purple;
            position: absolute;
            top: 0;
            transform: rotateZ(90deg) rotateY(90deg) translateZ(220px) translateY(-100px)
        }

        .six {
            position: absolute;
            top: 0;
            background: blue;
        }


        @keyframes leftToRight {
            0% {
                transform: rotateZ(90deg) rotateY(90deg) translateZ(-300px) translateY(-100px);
            }

            50% {
                transform: rotateZ(90deg) rotateY(90deg) translateZ(-300px) translateY(100px);
            }

            100% {
                transform: rotateZ(90deg) rotateY(90deg) translateZ(-300px) translateY(-100px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="face one"></div>
            <div class="face two"></div>
            <div class="face three"></div>
            <div class="face four"></div>
            <div class="face five"></div>
            <div class="face six"></div>
        </div>
    </div>
</body>
</html>
