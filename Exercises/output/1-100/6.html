<!-- drawing and animation -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        .background {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            background: 
                linear-gradient(40deg, rgba(0, 0, 255, 0.394), rgba(0, 0, 0, 0.335)),
                radial-gradient(100% 100% at 50% 50%, rgba(0, 0, 0, 0.15) 50%, rgba(0, 100, 0, 0.224) 50%) 20% 20% / 100% 100%,
                linear-gradient(180deg, rgba(238, 130, 238, 0.484), rgb(234, 210, 210)),
                repeating-radial-gradient(100% 100% at 50% 50%, rgba(0, 0, 0, 0.082) 50%, rgba(255, 255, 255, 0.099) 65%) 40% 40% / 100% 100%;
            background-repeat: no-repeat;
        }

        .one {
            width: 200px;
            height: 200px;
            background: 
                linear-gradient(30deg, rgba(0, 0, 255, 0.394), rgba(0, 0, 0, 0.335)),
                radial-gradient(100% 100% at 100% 100%, rgba(0, 0, 0, 0.575) 50%, rgba(0, 100, 0, 0.851) 50%) 20% 20% / 100% 100%,
                linear-gradient(180deg, rgba(238, 130, 238, 0.484), rgb(234, 210, 210)),
                repeating-radial-gradient(100% 100% at 100% 100%, rgba(0, 0, 0, 0.082) 50%, rgba(255, 255, 255, 0.099) 65%) 40% 40% / 100% 100%;
            background-repeat: no-repeat;
            clip-path: polygon(0% 0, 100% 0%, 100% 100%);
            position: absolute;
            top: 50%;
            left: 50%;
        }

        .two {
            width: 200px;
            height: 200px;
            background: 
                linear-gradient(30deg, rgba(0, 0, 255, 0.394), rgba(0, 0, 0, 0.335)),
                radial-gradient(100% 100% at 0% 100%, rgba(0, 0, 0, 0.575) 50%, rgba(0, 100, 0, 0.851) 50%) 20% 20% / 100% 100%,
                linear-gradient(180deg, rgba(238, 130, 238, 0.484), rgb(234, 210, 210)),
                repeating-radial-gradient(100% 100% at 100% 100%, rgba(0, 0, 0, 0.082) 50%, rgba(255, 255, 255, 0.099) 65%) 40% 40% / 100% 100%;
            background-repeat: no-repeat;
            clip-path: polygon(0% 0, 100% 0%, 0% 100%);
            position: absolute;
            top: 50%;
            left: 50%;
        }

        .three {
            width: 200px;
            height: 200px;
            background: 
                linear-gradient(30deg, rgba(0, 0, 255, 0.394), rgba(0, 0, 0, 0.335)),
                radial-gradient(100% 100% at 0% 100%, rgba(0, 0, 0, 0.575) 50%, rgba(0, 100, 0, 0.851) 50%) 20% 20% / 100% 100%,
                linear-gradient(180deg, rgba(238, 130, 238, 0.484), rgb(234, 210, 210)),
                repeating-radial-gradient(100% 100% at 100% 100%, rgba(0, 0, 0, 0.082) 50%, rgba(255, 255, 255, 0.099) 65%) 40% 40% / 100% 100%;
            background-repeat: no-repeat;
            clip-path: polygon(0% 0, 100% 0%, 0% 100%);
            position: absolute;
            top: 50%;
            left: 50%;
        }

        .four {
            width: 200px;
            height: 200px;
            background: 
                linear-gradient(30deg, rgba(0, 0, 255, 0.394), rgba(0, 0, 0, 0.335)),
                radial-gradient(100% 100% at 100% 0%, rgba(0, 0, 0, 0.575) 50%, rgba(0, 100, 0, 0.851) 50%) 20% 20% / 100% 100%,
                linear-gradient(180deg, rgba(238, 130, 238, 0.484), rgb(234, 210, 210)),
                repeating-radial-gradient(100% 100% at 100% 100%, rgba(0, 0, 0, 0.082) 50%, rgba(255, 255, 255, 0.099) 65%) 40% 40% / 100% 100%;
            background-repeat: no-repeat;
            clip-path: polygon(100% 100%, 100% 0%, 0% 100%);
            position: absolute;
            top: 26%;
            left: 50%;
        }

        .five {
            width: 200px;
            height: 200px;
            background: 
                linear-gradient(30deg, rgba(0, 0, 255, 0.394), rgba(0, 0, 0, 0.335)),
                radial-gradient(100% 100% at 0% 0%, rgba(0, 0, 0, 0.575) 50%, rgba(0, 100, 0, 0.851) 50%) 20% 20% / 100% 100%,
                linear-gradient(180deg, rgba(238, 130, 238, 0.484), rgb(234, 210, 210)),
                repeating-radial-gradient(100% 100% at 100% 100%, rgba(0, 0, 0, 0.082) 50%, rgba(255, 255, 255, 0.099) 65%) 40% 40% / 100% 100%;
            background-repeat: no-repeat;
            clip-path: polygon(100% 100%, 0% 0%, 0% 100%);
            position: absolute;
            top: 26%;
            left: 50%;
        }

        .six {
            width: 100px;
            height: 100px;
            border-radius: 100% /50% 50% 230% 230%;
            background-color: black;
            position: absolute;
            left: 57%;
            top: 23%;
        }

        .seven {
            width: 100px;
            height: 100px;
            border-radius: 100% /50% 50% 230% 230%;
            background-color: black;
            position: absolute;
            left: 57%;
            top: 65%;
            transform: rotateZ(180deg)
        }

        .eight {
            width: 200px;
            height: 400px;
            background-color: black;
            border-radius: 100% / 100% 0 0 100%;
            position: absolute;
            left: 21.2%;
            top: 25.6%;
        }

        .nine {
            width: 200px;
            height: 400px;
            background-color: black;
            border-radius: 100% / 100% 0 0 100%;
            position: absolute;
            left: 78.97%;
            top: 25.6%;
            transform: rotateY(180deg);
        }

        .ten {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: black;
            position: absolute;
            left: 57%;
            animation: bounce 19s infinite ease-in-out;
        }
        

        @keyframes bounce {
            0% {
                top: 0%;
            }

            10% {
                top: 11%;
            }

            20% {
                top: 11%;
                left: 0%;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="one"></div>
        <div class="two"></div>
        <div class="three"></div>
        <div class="four"></div>
        <div class="five"></div>
        <div class="six"></div>
        <div class="seven"></div>
        <div class="eight"></div>
        <div class="nine"></div>
        <div class="ten"></div>
    </div>
</body>
</html>
