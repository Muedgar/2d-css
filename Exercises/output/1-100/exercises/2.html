<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color:aliceblue;
            display: flex;
            flex-direction: row;
            justify-content: center;
        }

        .cartoon {
            width: 500px;
            height: 500px;
            margin-top: 100px;
            border-radius: 100% / 80% 80% 120% 120%;
            border: 1vmin solid;
            position: relative
        }

        .eyes-container {
            background-color: antiquewhite;
            display: flex;
            
        }

        .eyes {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 1vmin solid;
        }
        
        .left {
            background: radial-gradient(100% 100% at 70% 50%, black 20%, white 20%) 10% 10% / 100% 100%;
            background-repeat: no-repeat;
        }

        .right {
            background: radial-gradient(100% 100% at 70% 50%, black 20%, white 20%) 10% 10% / 100% 100%;
        }

    </style>
</head>
<body>
    <div class="cartoon">
        <div class="eyes-container">
            <div class="eyes left"></div>
            <div class="eyes right"></div>
        </div>
        <div class="nose-container"></div>
        <div class="mouth-container"></div>
        <div class="ears-container"></div>
        <div class="neck-container"></div>
        <div class="cap-container"></div>
    </div>
</body>
</html>
