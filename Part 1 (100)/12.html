<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            overflow: hidden;
            background: #cdf;
        }

        .cartoon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vmin;
            height: 80vmin;
        }

        .cartoon div {
            position: absolute;
            box-sizing: border-box;
        }

        .b {
            border: 0.5vmin solid;
        }

        .r {
            border-radius: 100%;
        }

        .hb::before,
        .ha::after {
            content: "";
            display: block;
            position: absolute;
            box-sizing: border-box;
        }

        
    </style>
</head>
<body>
    <div class="cartoon hb">
        <div class="head">
            <div class="eyebrow r"></div>
            <div class="eyebrow r"></div>
            <div class="cheek r"></div>
        </div>
    </div>
</body>
</html>
