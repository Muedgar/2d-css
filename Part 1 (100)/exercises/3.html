<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 100px 0 0 0;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        
        .cartoon {
            width: 500px;
            height: 500px;
            border: 1vmin solid;
            border-radius: 100% / 80% 80% 120% 120%;
            position: relative;
        }

        .hair {
            width: 10px;
            height: 200px;
            border-left: .4vmin solid;
            border-radius: 100%;
            position: absolute;
        }

        .hair.one {
            transform: translateX(50px) translateY(40px) rotate(20deg);
        }

        .hair.two {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.three {
            transform: translateX(39px) translateY(45px) rotate(25deg);
        }

        .hair.four {
            transform: translateX(45px) translateY(40px) rotate(20deg);
        }

        .hair.five {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.six {
            transform: translateX(45px) translateY(40px) rotate(20deg);
        }

        .hair.seven {
            transform: translateX(44px) translateY(40px) rotate(22deg);
        }

        .hair.eight {
            transform: translateX(55px) translateY(40px) rotate(16deg);
        }

        .hair.nine {
            transform: translateX(57px) translateY(40px) rotate(14deg);
        }

        .hair.ten {
            transform: translateX(60px) translateY(32px) rotate(23deg);
        }

        .hair.eleven {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.twelve {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.thirteen {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.fourteen {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.fifteen {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.sixteen {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.seventeen {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.eighteen {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.nineteen {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }

        .hair.twenty {
            transform: translateX(45px) translateY(40px) rotate(23deg);
        }
    </style>
</head>
<body>
    <div class="cartoon">
        <div class="hair one"></div>
        <div class="hair two"></div>
        <div class="hair three"></div>
        <div class="hair four"></div>
        <div class="hair five"></div>
        <div class="hair six"></div>
        <div class="hair seven"></div>
        <div class="hair eight"></div>
        <div class="hair nine"></div>
        <div class="hair ten"></div>
        <div class="hair eleven"></div>
        <div class="hair twelve"></div>
        <div class="hair thirteen"></div>
        <div class="hair fourteen"></div>
        <div class="hair fifteen"></div>
        <div class="hair sixteen"></div>
        <div class="hair seventeen"></div>
        <div class="hair eighteen"></div>
        <div class="hair nineteen"></div>
        <div class="hair twenty"></div>
    </div>
</body>
</html>
