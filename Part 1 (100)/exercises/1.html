
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            overflow: hidden;
            background: rgba(161, 182, 202, 0.5);
        }

        .cartoon {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translate(-50%, 0%);
            width: 80vmin;
            height: 80vmin;
        }

        .cartoon div {
            position: absolute;
            box-sizing: border-box;
        }

        .b {
            border: 0.5vmin solid;
        }

        .r {
            border-radius: 100%;
        }

        .hb::before,
        .ha::after {
            content: "";
            display: block;
            position: absolute;
            box-sizing: border-box;
        }

        .cartoon {
  --skin: #fca;
  --skin-dark: #fb9;
  --cap-light: #fff; 
  --cap-dark: #eee;
  --cap-lid: #777;
  --cap-front: #8f5158;
  --cap-front-dark: #7f4148;
}

    .eyes {
        width: 60%;
        height: 60%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-image: 
            linear-gradient(transparent 30%, var(--skin) 0 40%, black 0 41.5%, transparent 0),
            radial-gradient(circle at 43.4% 50%, black 5%, transparent 0),
            radial-gradient(circle at 75% 50%, black 4%, transparent 0),
            radial-gradient(circle at 30% 55%, white 30%, transparent 0);
        background-position: center center;
        background-repeat: no-repeat;
    }
    </style>
</head>
<body>
      <div class="cartoon hb show-cap">
  <div class="cap cap-lid"></div>
  <div class="ear ear-back"></div>
  <div class="neck"></div>
  <div class="forehead"></div>
  <div class="face"></div>
  <div class="eyes"></div>
  <div class="nose"></div>
  <div class="mouth ha"></div>
  <div class="eyebrow"></div>
  <div class="eyebrow"></div>
  <div class="cap-top"></div>
  <div class="ear ha hb"></div>
  <div class="cap cap-line ha"></div>
</div>
</body>
</html>
