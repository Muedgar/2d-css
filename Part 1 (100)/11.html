<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .face {
            width: 500px;
            height: 500px;
            background: linear-gradient(blue 30%, red 90%);
            animation: changeradius 5s infinite;
        }

        @keyframes changeradius {
            0% {
                border-radius: 100% / 120% 120% 80% 80%;
            }

            50% {
                border-radius: 100% / 80% 80% 120% 120%;
            }

            100% {
                border-radius: 100% / 120% 120% 80% 80%;
            }
        }
    </style>
</head>
<body>
    <div class="face"></div>
</body>
</html>
