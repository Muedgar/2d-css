<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .face {
            width: 500px;
            height: 500px;
            background: 
            radial-gradient(20% 20% at 35% 35%, yellow 48% 50%, rgba(255, 192, 203, 0.123) 50% 30%) 0% 0% / 100% 100%,
            radial-gradient(20% 20% at 70% 35%, yellow 48% 50%, rgba(255, 192, 203, 0.123) 50% 30%) 0% 0% / 100% 100%,
            radial-gradient(40% 10% at 53% 74%, yellow 48% 50%, rgba(255, 192, 203, 0.123) 50% 30%) 0% 0% / 100% 100%,
            linear-gradient(blue 30%, red 90%);
            background-repeat: no-repeat;
            animation: changeradius 5s infinite;
        }

        @keyframes changeradius {
            0% {
                border-radius: 100% / 120% 120% 80% 80%;
            }

            50% {
                border-radius: 100% / 80% 80% 120% 120%;
            }

            100% {
                border-radius: 100% / 120% 120% 80% 80%;
            }
        }
    </style>
</head>
<body>
    <div class="face"></div>
</body>
</html>
