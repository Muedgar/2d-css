<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Blue Hour Portrait
    </title>
    <style>
      :root {
        --background: #9aafbd;
        --accent: #f0b798;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--accent);
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(92vw, 680px);
        padding: 28px 0;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        font-weight: 500;
        letter-spacing: -.04em;
      }

      header span {
        font-size: .65rem;
        letter-spacing: .12em;
        white-space: nowrap;
      }

      .face {
        position: relative;
        width: min(100%, 68svh);
        margin: 18px auto;
        aspect-ratio: 1;
        container-type: inline-size;
        isolation: isolate;
      }

      .face div {
        position: absolute;
      }

      .face :where(div) {
        inset: 0;
      }

      .face div {
        pointer-events: none;
      }

      .face {
        pointer-events: auto;
      }

      p {
        font-size: .75rem;
        letter-spacing: .02em;
        opacity: .8;
      }

      nav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: .75rem;
      }

      a {
        color: inherit;
        text-underline-offset: 4px;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 6px;
      }

      .shoulders {
        background: #253951;
        clip-path: polygon(
          8% 100%,
          13% 89%,
          30% 81%,
          40% 78%,
          63% 78%,
          77% 84%,
          91% 93%,
          96% 100%
        );
      }

      .neck {
        background: #c2807f;
        clip-path: polygon(40% 62%, 61% 62%, 62% 78%, 69% 83%, 54% 95%, 32% 84%, 40% 76%);
      }

      .neck-shadow {
        background: #68618d;
        clip-path: polygon(40% 62%, 54% 70%, 57% 80%, 54% 95%, 32% 84%, 40% 76%);
      }

      .head {
        background: #e4a18e;
        clip-path: polygon(
          35% 18%,
          58% 12%,
          73% 22%,
          78% 37%,
          75% 52%,
          68% 66%,
          59% 74%,
          48% 75%,
          37% 66%,
          28% 48%,
          27% 32%
        );
      }

      .left-plane {
        background: #6a80ad;
        clip-path: polygon(
          35% 18%,
          45% 19%,
          42% 33%,
          46% 42%,
          43% 50%,
          47% 58%,
          43% 63%,
          49% 71%,
          48% 75%,
          37% 66%,
          28% 48%,
          27% 32%
        );
      }

      .right-plane {

          66% 19%,
          73% 22%,
          78% 37%,
          75% 52%,
          68% 66%,
          59% 74%,
          53% 74%,
          60% 66%,

      }

      .temple {
        background: #c18789;
        clip-path: polygon(66% 23%, 73% 29%, 75% 38%, 69% 44%, 64% 38%, 64% 33%);
      }

      .ear {

      .ear-shadow {

      .eye-white.right {

      .lip-shadow {

      .lip-upper {

      .lip-lower {

          52% 67%,
          48% 65%

      }

      .lip-light {

          24% 17%,

          80% 23%,
          80% 38%,

          75% 32%,

      .hair-highlight {

      .curl {
        background: #303651;

          62% 15%,

          72% 23%,
          70% 29%,
          66% 32%,
          64% 31%,
          68% 27%,
          68% 23%

      .collar {
        background: #526580;
      }

      .collar.left {
        clip-path: polygon(36% 78%, 49% 91%, 42% 98%, 28% 83%);
      }

      .collar.right {
        clip-path: polygon(62% 78%, 69% 82%, 58% 96%, 54% 91%);
      }

      .earring {
        inset: 53% 71% 38% 23%;
        border: .65cqi solid #e9c487;
        border-radius: 50%;
        transform: rotate(-15deg);
      }
    </style>
