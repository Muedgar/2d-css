<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Midnight Moon
    </title>
    <style>
      :root {
        --background: #20263d;
        --accent: #f5df9e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--accent);
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(92vw, 680px);
        padding: 28px 0;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        font-weight: 500;
        letter-spacing: -.04em;
      }

      header span {
        font-size: .65rem;
        letter-spacing: .12em;
        white-space: nowrap;
      }

      .face {
        position: relative;
        width: min(100%, 68svh);
        margin: 18px auto;
        aspect-ratio: 1;
        container-type: inline-size;
        isolation: isolate;
      }

      .face div {
        position: absolute;
      }

      .face :where(div) {
        inset: 0;
      }

      .face div {
        pointer-events: none;
      }

      .face {
        pointer-events: auto;
      }

      p {
        font-size: .75rem;
        letter-spacing: .02em;
        opacity: .8;
      }

      nav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: .75rem;
      }

      a {
        color: inherit;
        text-underline-offset: 4px;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 6px;
      }

      .halo {
        inset: 12%;
        border: 1px solid #e8d6a238;
        border-radius: 50%;
      }

      .head {
        inset: 20%;
        background: #f5df9e;
        border-radius: 50%;
      }

      .shadow {
        inset: 20%;
        background: #cda866;
        border-radius: 50%;
        clip-path: polygon(0 0, 38% 0, 27% 18%, 22% 42%, 29% 67%, 49% 89%, 80% 100%, 0 100%);
      }

      .eye {
        inset: auto;
        top: 45%;
        width: 12%;
        height: 6%;
        border-bottom: .8cqi solid #423848;
        border-radius: 0 0 50% 50%;
      }

      .eye.left {
        left: 31%;
      }

      .eye.right {
        left: 57%;
      }

      .nose {
        background: #cda866;
        clip-path: polygon(50% 43%, 45% 59%, 53% 59%);
      }

      .cheek {
        inset: auto;
        top: 55%;
        width: 9%;
        height: 4%;
        background: #d99380;
        border-radius: 50%;
        opacity: .65;
      }

      .cheek.left {
        left: 28%;
      }

      .cheek.right {
        left: 64%;
      }

      .mouth {
        inset: 61% 43% 32%;
        border-bottom: .65cqi solid #69504c;
        border-radius: 50%;
      }

      .star {
        inset: auto;
        width: 5%;
        height: 5%;
        background: #f5df9e;
        clip-path: polygon(
          50% 0,
          62% 37%,
          100% 50%,
          62% 63%,
          50% 100%,
          38% 63%,
          0 50%,
          38% 37%
        );
      }

      .star.one {
        left: 14%;
        top: 23%;
      }

      .star.two {
        inset: auto;
        left: 80%;
        top: 60%;
        width: 3%;
        height: 3%;
      }

      .star.three {
        inset: auto;
        left: 75%;
        top: 15%;
        width: 4%;
        height: 4%;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>
          Midnight Moon
        </h1>
        <span>
          01 / EASY
        </span>
      </header>
      <div class="face" role="img" aria-label="Midnight Moon, a CSS face illustration">
        <div class="halo">
        </div>
        <div class="head">
        </div>
        <div class="shadow">
        </div>
        <div class="eye left">
        </div>
        <div class="eye right">
        </div>
        <div class="nose">
        </div>
        <div class="cheek left">
        </div>
        <div class="cheek right">
        </div>
        <div class="mouth">
        </div>
        <div class="star one">
        </div>
        <div class="star two">
        </div>
        <div class="star three">
        </div>
      </div>
      <p>
        Silhouette · border-radius · layered shadows
      </p>
      <nav>
        <span>
        </span>
        <a href="index.html">
          All faces
        </a>
        <a href="02-alley-cat.html">
          Next
        </a>
      </nav>
    </main>
  </body>
</html>
