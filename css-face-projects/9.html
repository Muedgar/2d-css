<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Golden Harlequin
    </title>
    <style>
      :root {
        --background: #263d48;
        --accent: #e5b75e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--accent);
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(92vw, 680px);
        padding: 28px 0;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        font-weight: 500;
        letter-spacing: -.04em;
      }

      header span {
        font-size: .65rem;
        letter-spacing: .12em;
        white-space: nowrap;
      }

      .face {
        position: relative;
        width: min(100%, 68svh);
        margin: 18px auto;
        aspect-ratio: 1;
        container-type: inline-size;
        isolation: isolate;
      }

      .face div {
        position: absolute;
      }

      .face :where(div) {
        inset: 0;
      }

      .face div {
        pointer-events: none;
      }

      .face {
        pointer-events: auto;
      }

      p {
        font-size: .75rem;
        letter-spacing: .02em;
        opacity: .8;
      }

      nav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: .75rem;
      }

      a {
        color: inherit;
        text-underline-offset: 4px;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 6px;
      }

      .plume {
        background: #386570;
      }

      .plume.left {
        clip-path: polygon(32% 43%, 11% 32%, 7% 13%, 26% 19%, 39% 37%, 21% 26%);
      }

      .plume.center {
        background: #518b8b;
        clip-path: polygon(42% 34%, 31% 9%, 41% 3%, 56% 25%, 57% 37%, 43% 16%, 48% 36%);
      }

      .plume.right {
        background: #2b5361;
        clip-path: polygon(58% 37%, 65% 16%, 86% 5%, 90% 23%, 72% 43%, 78% 21%);
      }

      .neck {
        background: #b98976;
        clip-path: polygon(39% 68%, 61% 68%, 62% 86%, 80% 100%, 20% 100%, 38% 86%);
      }

      .head {
        background: #e0b297;
        clip-path: polygon(
          35% 26%,
          61% 24%,
          75% 40%,
          72% 62%,
          62% 79%,
          50% 87%,
          37% 79%,
          27% 61%,
          26% 42%
        );
      }

      .shadow {
        background: #b78275;
        clip-path: polygon(
          61% 24%,
          75% 40%,
          72% 62%,
          62% 79%,
          50% 87%,
          56% 71%,
          62% 62%,
          59% 49%
        );
      }

      .jaw {
        background: #c8947e;
        clip-path: polygon(27% 61%, 38% 68%, 43% 80%, 50% 87%, 37% 79%);
      }

      .hair {
        background: #34333e;
        clip-path: polygon(
          26% 54%,
          21% 38%,
          31% 23%,
          50% 18%,
          67% 23%,
          78% 37%,
          74% 56%,
          69% 39%,
          59% 31%,
          42% 33%,
          31% 43%
        );
      }

      .mask-base {
        background: #bd8a43;
        clip-path: polygon(
          24% 38%,
          38% 35%,
          50% 42%,
          63% 34%,
          77% 36%,
          73% 56%,
          60% 60%,
          50% 54%,
          39% 61%,
          27% 56%
        );
      }

      .mask-gold {
        background: #e5b75e;
        clip-path: polygon(
          24% 38%,
          38% 35%,
          50% 42%,
          50% 54%,
          39% 61%,
          27% 56%,
          34% 51%,
          44% 51%,
          40% 44%
        );
      }

      .mask-light {
        background: #ffdc8d;
        clip-path: polygon(
          24% 38%,
          38% 35%,
          50% 42%,
          63% 34%,
          77% 36%,
          65% 38%,
          53% 46%,
          49% 49%,
          43% 43%,
          35% 39%,
          26% 41%
        );
      }

      .mask-dark {
        background: #8a683f;
        clip-path: polygon(
          50% 49%,
          53% 46%,
          65% 38%,
          77% 36%,
          73% 56%,
          60% 60%,
          64% 55%,
          72% 51%,
          73% 41%,
          62% 43%,
          56% 49%,
          50% 54%
        );
      }

      .eye {
        background: #edd2ae;
      }

      .eye.left {
        clip-path: polygon(29% 47%, 36% 43%, 44% 49%, 37% 53%);
      }

      .eye.right {
        clip-path: polygon(56% 49%, 64% 42%, 71% 45%, 64% 52%);
      }

      .pupil {
        inset: auto;
        background: #3b4d4a;
        top: 46%;
        width: 3.5%;
        height: 5%;
        border-radius: 50%;
      }

      .pupil.left {
        left: 35%;
      }

      .pupil.right {
        left: 62%;
      }

      .eye-rim {
        background: #58463c;
      }

      .eye-rim.left {
        clip-path: polygon(28% 47%, 36% 42%, 45% 49%, 36% 45%);
      }

      .eye-rim.right {
        clip-path: polygon(55% 49%, 64% 41%, 72% 45%, 64% 44%);
      }

      .nose {
        background: #a77465;
        clip-path: polygon(50% 52%, 47% 64%, 43% 66%, 51% 69%, 56% 66%, 51% 64%);
      }

      .lip-upper {
        background: #7b4051;
        clip-path: polygon(41% 74%, 47% 71%, 50% 73%, 54% 71%, 61% 73%, 51% 76%);
      }

      .lip-lower {
        background: #b66c70;
        clip-path: polygon(41% 74%, 51% 76%, 61% 73%, 55% 79%, 48% 80%);
      }

      .lip-shine {
        background: #edb19b;
        clip-path: polygon(48% 77%, 55% 76%, 52% 78%);
      }

      .jewel {
        background: #3b9394;
        clip-path: polygon(50% 39%, 54% 44%, 50% 51%, 46% 44%);
      }

      .chain {
        inset: 81% 35% 5%;
        border-bottom: .6cqi solid #e4b863;
        border-radius: 0 0 50% 50%;
      }

      .pendant {
        background: #e4b863;
        clip-path: polygon(50% 92%, 53% 95%, 50% 99%, 47% 95%);
      }
    </style>
  </head>
