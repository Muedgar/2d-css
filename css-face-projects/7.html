<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Woodland Elf
    </title>
    <style>
      :root {
        --background: #172f2c;
        --accent: #dfc79b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--accent);
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(92vw, 680px);
        padding: 28px 0;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        font-weight: 500;
        letter-spacing: -.04em;
      }

      header span {
        font-size: .65rem;
        letter-spacing: .12em;
        white-space: nowrap;
      }

      .face {
        position: relative;
        width: min(100%, 68svh);
        margin: 18px auto;
        aspect-ratio: 1;
        container-type: inline-size;
        isolation: isolate;
      }

      .face div {
        position: absolute;
      }

      .face :where(div) {
        inset: 0;
      }

      .face div {
        pointer-events: none;
      }

      .face {
        pointer-events: auto;
      }

      p {
        font-size: .75rem;
        letter-spacing: .02em;
        opacity: .8;
      }

      nav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: .75rem;
      }

      a {
        color: inherit;
        text-underline-offset: 4px;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 6px;
      }

      .hair-back {
        background: #274b42;
        clip-path: polygon(
          18% 90%,
          22% 30%,
          34% 12%,
          60% 8%,
          78% 25%,
          82% 90%,
          66% 83%,
          58% 97%,
          46% 88%,
          31% 96%
        );
      }

      .ear {
        background: #c5ad7f;
      }

      .ear.left {
        clip-path: polygon(31% 44%, 6% 28%, 17% 55%, 33% 64%);
      }

      .ear.right {
        clip-path: polygon(69% 44%, 94% 28%, 83% 55%, 67% 64%);
      }

      .inner-ear {
        background: #8a886b;
      }

      .inner-ear.left {
        clip-path: polygon(29% 47%, 13% 35%, 21% 52%, 29% 57%);
      }

      .inner-ear.right {
        clip-path: polygon(71% 47%, 87% 35%, 79% 52%, 71% 57%);
      }

      .neck {
        background: #a5a17a;
        clip-path: polygon(40% 68%, 60% 68%, 61% 84%, 73% 96%, 27% 96%, 39% 84%);
      }

      .head {
        background: #dfc79b;
        clip-path: polygon(
          35% 24%,
          60% 20%,
          72% 35%,
          69% 61%,
          61% 74%,
          50% 82%,
          39% 74%,
          30% 61%,
          28% 38%
        );
      }

      .temple {
        background: #c1b083;
        clip-path: polygon(
          60% 20%,
          72% 35%,
          69% 61%,
          61% 74%,
          50% 82%,
          56% 67%,
          62% 57%,
          59% 45%,
          64% 34%
        );
      }

      .cheek-plane {
        background: #b29b77;
        clip-path: polygon(30% 51%, 40% 56%, 46% 63%, 38% 68%, 32% 60%);
      }

      .forehead {
        background: #f0d8a7;
        clip-path: polygon(37% 28%, 54% 24%, 51% 39%, 43% 42%, 32% 39%);
      }

      .hair {
        background: #36604c;
      }

      .hair.left {
        clip-path: polygon(
          22% 41%,
          27% 20%,
          43% 11%,
          57% 13%,
          47% 28%,
          35% 34%,
          32% 50%,
          36% 67%,
          27% 59%
        );
      }

      .hair.right {
        clip-path: polygon(
          54% 13%,
          69% 15%,
          77% 32%,
          74% 64%,
          64% 73%,
          69% 51%,
          64% 32%,
          56% 27%
        );
      }

      .brow {
        background: #365044;
      }

      .brow.left {
        clip-path: polygon(33% 44%, 40% 42%, 47% 45%, 45% 47%, 39% 45%);
      }

      .brow.right {
        clip-path: polygon(54% 45%, 61% 42%, 67% 43%, 63% 45%, 55% 47%);
      }

      .eye {
        background: #f3e9cf;
      }

      .eye.left {
        clip-path: polygon(33% 49%, 39% 47%, 46% 50%, 39% 52%);
      }

      .eye.right {
        clip-path: polygon(54% 50%, 61% 47%, 67% 48%, 61% 51%);
      }

      .iris {
        inset: auto;
        top: 48%;
        width: 3%;
        height: 3%;
        border-radius: 50%;
        background: #658b5b;
      }

      .iris.left {
        left: 38%;
      }

      .iris.right {
        left: 60%;
      }

      .nose-shadow {
        background: #ac926d;
        clip-path: polygon(51% 43%, 48% 58%, 44% 61%, 53% 63%, 56% 60%, 51% 58%);
      }

      .nostril {
        background: #6e7257;
        clip-path: polygon(49% 61%, 53% 61%, 52% 62%);
      }

      .lip-upper {
        background: #99776a;
        clip-path: polygon(41% 68%, 47% 66%, 50% 67%, 54% 66%, 59% 68%, 50% 70%);
      }

      .lip-lower {
        background: #bf9c7c;
        clip-path: polygon(41% 68%, 50% 70%, 59% 68%, 53% 73%, 47% 73%);
      }

      .chin-light {
        background: #ecd2a0;
        clip-path: polygon(44% 76%, 54% 76%, 50% 79%);
      }

      .leaf {
        inset: auto;
        background: #8b9e57;
        clip-path: polygon(0 0, 70% 12%, 100% 100%, 22% 70%);
        width: 9%;
        height: 13%;
      }

      .leaf.one {
        left: 28%;
        top: 21%;
        transform: rotate(-30deg);
      }

      .leaf.two {
        left: 37%;
        top: 17%;
        transform: rotate(-10deg);
      }

      .leaf.three {
        left: 54%;
        top: 17%;
        transform: rotate(65deg);
      }

      .leaf.four {
        left: 63%;
        top: 21%;
        transform: rotate(80deg);
      }

      .gem {
        background: #edd69b;
        clip-path: polygon(50% 28%, 53% 32%, 50% 38%, 47% 32%);
      }
    </style>
  </head>
