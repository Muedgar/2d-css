<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .scene {
            width: 700px;
            height: 700px;
            background-color: antiquewhite;
            margin: 50px auto;
            transform-style: preserve-3d;
            perspective: 1000;
            transform-origin: 50% 50%;
        }

        .box {
            position: absolute;
            top: 20%;
            left: 25%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
        }

        .left {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: yellow;
            transform: rotateX(180deg);
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="box">
            <div class="left"></div>
            <div class="right"></div>
        </div>
    </div>
</body>
</html>
