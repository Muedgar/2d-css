<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *, *::before, *::after {
  padding: 0;
  margin: 0 auto;
  box-sizing: border-box;
}

body {
  background-image: linear-gradient(#024, #200 50%);
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-size: 10px;
  perspective: 80em;
  overflow: hidden;
}
body *:not(:empty) {
  transform-style: preserve-3d;
}

.scene {
  position: relative;
  -webkit-animation: scene 60s -50s infinite linear;
          animation: scene 60s -50s infinite linear;
}
@-webkit-keyframes scene {
  from {
    transform: translateY(-5em) rotateY(0deg);
  }
  to {
    transform: translateY(-5em) rotateY(-360deg);
  }
}
@keyframes scene {
  from {
    transform: translateY(-5em) rotateY(0deg);
  }
  to {
    transform: translateY(-5em) rotateY(-360deg);
  }
}

.ferriswheel {
  position: absolute;
}
@-webkit-keyframes wheel {
  from {
    transform: rotateZ(0deg);
  }
  to {
    transform: rotateZ(360deg);
  }
}
@keyframes wheel {
  from {
    transform: rotateZ(0deg);
  }
  to {
    transform: rotateZ(360deg);
  }
}

        .stand .side > div {
  position: absolute;
}
.stand .side > div:nth-child(1) {
  width: 25em;
  height: 25em;
  transform: translateX(-10%) rotateX(180deg);
  transform-origin: top;
  background-image: conic-gradient(from 140deg at top, #000 0, transparent 18.5deg, #000 37deg 43deg, transparent 61.5deg, #000 80deg), linear-gradient(#000, #678 10%, #234);
  -webkit-clip-path: polygon(50% 0, 0 100%, 25% 100%, 50% 0, 100% 100%, 75% 100%);
          clip-path: polygon(50% 0, 0 100%, 25% 100%, 50% 0, 100% 100%, 75% 100%);
}
.stand .side > div:nth-child(2) {
  width: 25em;
  height: 25.55em;
  transform: translateX(-50%) rotateX(12deg);
  transform-origin: top;
  background-image: conic-gradient(from 140deg at top, #000 0, transparent 18.5deg, #000 37deg 43deg, transparent 61.5deg, #000 80deg), linear-gradient(#000, #abc 10%, #234);
  -webkit-clip-path: polygon(50% 0, 0 100%, 25% 100%, 50% 0, 100% 100%, 75% 100%);
          clip-path: polygon(50% 0, 0 100%, 25% 100%, 50% 0, 100% 100%, 75% 100%);
}
.stand .side > div:nth-child(3) {
  width: 6em;
  height: 28em;
  transform: rotateY(-90deg) rotateX(atan(0.5));
  transform-origin: top left;
  -webkit-clip-path: polygon(0 0, 1.7em 100%, 5.4em 100%);
          clip-path: polygon(0 0, 1.7em 100%, 5.4em 100%);
  background-image: conic-gradient(from 160deg at top left, #000 0, transparent 13deg, #000 30deg), linear-gradient(#000, #abc 10%, #234);
}
.stand .side > div:nth-child(4) {
  width: 6em;
  height: 25.7em;
  transform: rotateY(-90deg) rotateX(atan(0.25));
  transform-origin: top left;
  -webkit-clip-path: polygon(0 0, 1.7em 100%, 5.4em 100%);
          clip-path: polygon(0 0, 1.7em 100%, 5.4em 100%);
  background-image: conic-gradient(from 160deg at top left, #000 0, transparent 13deg, #000 30deg), linear-gradient(#000, #234 10%);
}
.stand .side > div:nth-child(5) {
  width: 6em;
  height: 28em;
  transform: rotateY(-90deg) rotateX(atan(-0.5));
  transform-origin: top left;
  -webkit-clip-path: polygon(0 0, 1.7em 100%, 5.3em 100%);
          clip-path: polygon(0 0, 1.7em 100%, 5.3em 100%);
  background-image: conic-gradient(from 160deg at top left, #000 0, transparent 13deg, #000 30deg), linear-gradient(#000, #abc 10%, #234);
}
.stand .side > div:nth-child(6) {
  width: 6em;
  height: 25.7em;
  transform: rotateY(-90deg) rotateX(atan(-0.25));
  transform-origin: top left;
  -webkit-clip-path: polygon(0 0, 1.7em 100%, 5.3em 100%);
          clip-path: polygon(0 0, 1.7em 100%, 5.3em 100%);
  background-image: conic-gradient(from 160deg at top left, #000 0, transparent 13deg, #000 30deg), linear-gradient(#000, #234 10%);
}

    </style>
</head>
<body>
    <div class="scene">
        <div class="ferriswheel">
            <div class="stand">
                <div class="side">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
