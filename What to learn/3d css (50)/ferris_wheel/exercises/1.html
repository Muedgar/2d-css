<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>01 · The spinning birthday present</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101c2b;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 400px;
            overflow: hidden;
            perspective: 850px;
            background: radial-gradient(ellipse at 50% 35%, #304e68, #15283e 70%);
            isolation: isolate;
        }

        .stage::before {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            top: calc(50% + 160px);
            height: 80px;
            background: radial-gradient(ellipse, #0008, transparent 70%);
            filter: blur(8px);
        }

        .model {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .model * {
            transform-style: preserve-3d;
        }

        .box {
            position: absolute;
            width: var(--w);
            height: var(--h);
        }

        .face {
            position: absolute;
            background: var(--paint);
            border: 1px solid #ffffff25;
            box-shadow: inset 0 0 20px #0002;
        }

        .face.front,.face.back {
            width: var(--w);
            height: var(--h);
        }

        .face.front {
            transform: translateZ(calc(var(--d) / 2));
            background-image: linear-gradient(135deg,#fff2,transparent);
        }

        .face.back {
            transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
        }

        .face.right,.face.left {
            left: calc((var(--w) - var(--d)) / 2);
            width: var(--d);
            height: var(--h);
            background-image: linear-gradient(#0002,#0004);
        }

        .face.right {
            transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
        }

        .face.left {
            transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
        }

        .face.top,.face.bottom {
            top: calc((var(--h) - var(--d)) / 2);
            width: var(--w);
            height: var(--d);
        }

        .face.top {
            transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
            background-image: linear-gradient(#fff4,#fff1);
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
        }

        .hub {
            position: absolute;
            left: -10px;
            top: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,#fff,#dca956);
        }

        .ray {
            position: absolute;
            left: 0;
            top: -3px;
            width: var(--r);
            height: 6px;
            background: #edc884;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .cab {
            position: absolute;
            width: 0;
            height: 0;
        }

        .post {
            position: absolute;
            top: -14px;
            width: 3px;
            height: 38px;
            background: linear-gradient(90deg,#678091,#eee,#678091);
        }

        .present {
            animation: turn 18s linear infinite;
        }

        .gift {
            transform: rotateX(-18deg) rotateY(-25deg);
        }

        .ribbon {
            position: absolute;
            background: #ffde84;
        }

        .vertical {
            width: 24px;
            height: 125px;
            left: -12px;
            top: -40px;
            transform: translateZ(71px);
        }

        .horizontal {
            width: 140px;
            height: 22px;
            left: -70px;
            top: 8px;
            transform: translateZ(72px);
        }

        .bow {
            position: absolute;
            top: -60px;
            transform: rotateX(90deg);
        }

        .petal {
            position: absolute;
            left: 0;
            top: -9px;
            width: 34px;
            height: 18px;
            border: 5px solid #ffde84;
            border-radius: 50%;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        @keyframes turn {
            to {
                transform: rotateY(360deg);
            }
        }

        @media (max-width: 540px) {
            .model {
                zoom: .78;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage * {
                animation-play-state: paused !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="model gift">
            <div class="present">
                <div class="box parcel" style="--w:140px;--h:125px;--d:140px;--paint:#f484a3;left:-70px;top:-40px;transform:translateZ(0px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="box lid" style="--w:154px;--h:18px;--d:154px;--paint:#ffb1c6;left:-77px;top:-58px;transform:translateZ(0px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="ribbon vertical"></div>
                <div class="ribbon horizontal"></div>
                <div class="bow">
                    <div class="petal" style="--a:0deg;--r:34px"></div>
                    <div class="petal" style="--a:45deg;--r:34px"></div>
                    <div class="petal" style="--a:90deg;--r:34px"></div>
                    <div class="petal" style="--a:135deg;--r:34px"></div>
                    <div class="petal" style="--a:180deg;--r:34px"></div>
                    <div class="petal" style="--a:225deg;--r:34px"></div>
                    <div class="petal" style="--a:270deg;--r:34px"></div>
                    <div class="petal" style="--a:315deg;--r:34px"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
