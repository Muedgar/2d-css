<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>08 · The mountain cable car</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101c2b;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 400px;
            overflow: hidden;
            perspective: 850px;
            background: radial-gradient(ellipse at 50% 35%, #304e68, #15283e 70%);
            isolation: isolate;
        }

        .stage::before {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            top: calc(50% + 160px);
            height: 80px;
            background: radial-gradient(ellipse, #0008, transparent 70%);
            filter: blur(8px);
        }

        .model {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .model * {
            transform-style: preserve-3d;
        }

        .box {
            position: absolute;
            width: var(--w);
            height: var(--h);
        }

        .face {
            position: absolute;
            background: var(--paint);
            border: 1px solid #ffffff25;
            box-shadow: inset 0 0 20px #0002;
        }

        .face.front,.face.back {
            width: var(--w);
            height: var(--h);
        }

        .face.front {
            transform: translateZ(calc(var(--d) / 2));
            background-image: linear-gradient(135deg,#fff2,transparent);
        }

        .face.back {
            transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
        }

        .face.right,.face.left {
            left: calc((var(--w) - var(--d)) / 2);
            width: var(--d);
            height: var(--h);
            background-image: linear-gradient(#0002,#0004);
        }

        .face.right {
            transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
        }

        .face.left {
            transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
        }

        .face.top,.face.bottom {
            top: calc((var(--h) - var(--d)) / 2);
            width: var(--w);
            height: var(--d);
        }

        .face.top {
            transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
            background-image: linear-gradient(#fff4,#fff1);
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
        }

        .hub {
            position: absolute;
            left: -10px;
            top: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,#fff,#dca956);
        }

        .ray {
            position: absolute;
            left: 0;
            top: -3px;
            width: var(--r);
            height: 6px;
            background: #edc884;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .cab {
            position: absolute;
            width: 0;
            height: 0;
        }

        .post {
            position: absolute;
            top: -14px;
            width: 3px;
            height: 38px;
            background: linear-gradient(90deg,#678091,#eee,#678091);
        }

        .cableway {
            transform: rotateX(-12deg) rotateY(-18deg);
        }

        .cable {
            position: absolute;
            left: -138px;
            top: -120px;
            width: 280px;
            height: 4px;
            background: #d5e2e6;
            transform-origin: 0 50%;
            transform: rotateZ(10deg);
        }

        .carrier {
            position: absolute;
            left: -138px;
            top: -120px;
            transform-origin: 0 0;
            animation: crossing 12s ease-in-out infinite alternate;
        }

        .level {
            transform: rotateZ(-10deg);
        }

        .hanger {
            position: absolute;
            left: -3px;
            top: 0;
            width: 6px;
            height: 38px;
            background: #d5e2e6;
        }

        .level .cab {
            top: 47px;
        }

        .cable-shadow {
            position: absolute;
            left: -40px;
            top: 125px;
            width: 80px;
            height: 45px;
            background: radial-gradient(#0c263b88,transparent 70%);
            transform: rotateX(90deg);
            animation: shadowcross 12s ease-in-out infinite alternate;
        }

        @keyframes crossing {
            from {
                transform: rotateZ(10deg) translateX(20px);
            }
            to {
                transform: rotateZ(10deg) translateX(260px);
            }
        }

        @keyframes shadowcross {
            from {
                transform: translateX(-118px) rotateX(90deg);
                opacity: .3;
            }
            to {
                transform: translateX(118px) rotateX(90deg);
                opacity: .7;
            }
        }

        @media (max-width: 540px) {
            .model {
                zoom: .78;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage * {
                animation-play-state: paused !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="model cableway">
            <div class="box base" style="--w:330px;--h:14px;--d:160px;--paint:#647e76;left:-165px;top:120px;transform:translateZ(0px)">
                <span class="face front"></span>
                <span class="face back"></span>
                <span class="face right"></span>
                <span class="face left"></span>
                <span class="face top"></span>
                <span class="face bottom"></span>
            </div>
            <div class="box tower" style="--w:15px;--h:240px;--d:15px;--paint:#adc9cf;left:-145px;top:-120px;transform:translateZ(0px)">
                <span class="face front"></span>
                <span class="face back"></span>
                <span class="face right"></span>
                <span class="face left"></span>
                <span class="face top"></span>
                <span class="face bottom"></span>
            </div>
            <div class="box tower" style="--w:15px;--h:190px;--d:15px;--paint:#adc9cf;left:130px;top:-70px;transform:translateZ(0px)">
                <span class="face front"></span>
                <span class="face back"></span>
                <span class="face right"></span>
                <span class="face left"></span>
                <span class="face top"></span>
                <span class="face bottom"></span>
            </div>
            <div class="cable"></div>
            <div class="carrier">
                <div class="level">
                    <div class="cab">
                        <div class="box body" style="--w:42px;--h:30px;--d:38px;--paint:#f2b76b;left:-21px;top:22px;transform:translateZ(0px)">
                            <span class="face front"></span>
                            <span class="face back"></span>
                            <span class="face right"></span>
                            <span class="face left"></span>
                            <span class="face top"></span>
                            <span class="face bottom"></span>
                        </div>
                        <div class="box roof" style="--w:52px;--h:7px;--d:46px;--paint:#eee6c8;left:-26px;top:-14px;transform:translateZ(0px)">
                            <span class="face front"></span>
                            <span class="face back"></span>
                            <span class="face right"></span>
                            <span class="face left"></span>
                            <span class="face top"></span>
                            <span class="face bottom"></span>
                        </div>
                        <i class="post" style="left:-18px;transform:translateZ(17px)"></i>
                        <i class="post" style="left:18px;transform:translateZ(17px)"></i>
                        <i class="post" style="left:-18px;transform:translateZ(-17px)"></i>
                        <i class="post" style="left:18px;transform:translateZ(-17px)"></i>
                    </div>
                    <div class="hanger"></div>
                </div>
            </div>
            <div class="cable-shadow"></div>
        </div>
    </div>
</body>
</html>
