<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>06 · The hexagonal lighthouse</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101c2b;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 400px;
            overflow: hidden;
            perspective: 850px;
            background: radial-gradient(ellipse at 50% 35%, #304e68, #15283e 70%);
            isolation: isolate;
        }

        .stage::before {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            top: calc(50% + 160px);
            height: 80px;
            background: radial-gradient(ellipse, #0008, transparent 70%);
            filter: blur(8px);
        }

        .model {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .model * {
            transform-style: preserve-3d;
        }

        .box {
            position: absolute;
            width: var(--w);
            height: var(--h);
        }

        .face {
            position: absolute;
            background: var(--paint);
            border: 1px solid #ffffff25;
            box-shadow: inset 0 0 20px #0002;
        }

        .face.front,.face.back {
            width: var(--w);
            height: var(--h);
        }

        .face.front {
            transform: translateZ(calc(var(--d) / 2));
            background-image: linear-gradient(135deg,#fff2,transparent);
        }

        .face.back {
            transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
        }

        .face.right,.face.left {
            left: calc((var(--w) - var(--d)) / 2);
            width: var(--d);
            height: var(--h);
            background-image: linear-gradient(#0002,#0004);
        }

        .face.right {
            transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
        }

        .face.left {
            transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
        }

        .face.top,.face.bottom {
            top: calc((var(--h) - var(--d)) / 2);
            width: var(--w);
            height: var(--d);
        }

        .face.top {
            transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
            background-image: linear-gradient(#fff4,#fff1);
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
        }

        .hub {
            position: absolute;
            left: -10px;
            top: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,#fff,#dca956);
        }

        .ray {
            position: absolute;
            left: 0;
            top: -3px;
            width: var(--r);
            height: 6px;
            background: #edc884;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .cab {
            position: absolute;
            width: 0;
            height: 0;
        }

        .post {
            position: absolute;
            top: -14px;
            width: 3px;
            height: 38px;
            background: linear-gradient(90deg,#678091,#eee,#678091);
        }

        .lighthouse {
            transform: rotateX(-15deg) rotateY(-25deg);
        }

        .tower-face {
            position: absolute;
            left: -35px;
            top: -85px;
            width: 70px;
            height: 210px;
            background: linear-gradient(#fff1d4 0 32%,#df7464 32% 48%,#fff1d4 48% 70%,#df7464 70% 84%,#fff1d4 84%);
            border: 1px solid #dcbba0;
            transform: rotateY(var(--a)) translateZ(60.622px);
        }

        .gallery {
            position: absolute;
            left: -85px;
            top: -106px;
            width: 170px;
            height: 147.224px;
            background: #507484;
            clip-path: polygon(0 50%,25% 0,75% 0,100% 50%,75% 100%,25% 100%);
            transform-origin: 50% 0;
            transform: rotateX(90deg) translateY(-73.612px);
        }

        .lantern {
            position: absolute;
            left: -32px;
            top: -164px;
            width: 64px;
            height: 58px;
            border: 6px solid #476676;
            background: linear-gradient(90deg,#d3f8e5,#ffe6a4,#d3f8e5);
            transform: translateZ(10px);
        }

        .cap {
            position: absolute;
            left: -56px;
            top: -195px;
            width: 112px;
            height: 40px;
            background: #e67868;
            clip-path: polygon(50% 0,100% 100%,0 100%);
            transform: translateZ(12px);
        }

        .light-spin {
            position: absolute;
            top: -140px;
            animation: beacon 9s linear infinite;
        }

        .light-beam {
            position: absolute;
            width: 220px;
            height: 70px;
            top: -35px;
            transform-origin: 0 50%;
            background: linear-gradient(90deg,#fff3b9aa,transparent);
            clip-path: polygon(0 45%,100% 0,100% 100%,0 55%);
        }

        @keyframes beacon {
            to {
                transform: rotateY(360deg);
            }
        }

        @media (max-width: 540px) {
            .model {
                zoom: .78;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage * {
                animation-play-state: paused !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="model lighthouse">
            <div class="box island" style="--w:240px;--h:18px;--d:200px;--paint:#648e84;left:-120px;top:123px;transform:translateZ(0px)">
                <span class="face front"></span>
                <span class="face back"></span>
                <span class="face right"></span>
                <span class="face left"></span>
                <span class="face top"></span>
                <span class="face bottom"></span>
            </div>
            <div class="tower">
                <div class="tower-face" style="--a:0deg"></div>
                <div class="tower-face" style="--a:60deg"></div>
                <div class="tower-face" style="--a:120deg"></div>
                <div class="tower-face" style="--a:180deg"></div>
                <div class="tower-face" style="--a:240deg"></div>
                <div class="tower-face" style="--a:300deg"></div>
                <div class="gallery"></div>
                <div class="lantern"></div>
                <div class="cap"></div>
                <div class="light-spin">
                    <div class="light-beam"></div>
                </div>
            </div>
            <div class="steps"></div>
        </div>
    </div>
</body>
</html>
