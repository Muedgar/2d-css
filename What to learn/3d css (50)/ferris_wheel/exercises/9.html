<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>09 · The clockmaker’s orrery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101c2b;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 400px;
            overflow: hidden;
            perspective: 850px;
            background: radial-gradient(ellipse at 50% 35%, #304e68, #15283e 70%);
            isolation: isolate;
        }

        .stage::before {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            top: calc(50% + 160px);
            height: 80px;
            background: radial-gradient(ellipse, #0008, transparent 70%);
            filter: blur(8px);
        }

        .model {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .model * {
            transform-style: preserve-3d;
        }

        .box {
            position: absolute;
            width: var(--w);
            height: var(--h);
        }

        .face {
            position: absolute;
            background: var(--paint);
            border: 1px solid #ffffff25;
            box-shadow: inset 0 0 20px #0002;
        }

        .face.front,.face.back {
            width: var(--w);
            height: var(--h);
        }

        .face.front {
            transform: translateZ(calc(var(--d) / 2));
            background-image: linear-gradient(135deg,#fff2,transparent);
        }

        .face.back {
            transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
        }

        .face.right,.face.left {
            left: calc((var(--w) - var(--d)) / 2);
            width: var(--d);
            height: var(--h);
            background-image: linear-gradient(#0002,#0004);
        }

        .face.right {
            transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
        }

        .face.left {
            transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
        }

        .face.top,.face.bottom {
            top: calc((var(--h) - var(--d)) / 2);
            width: var(--w);
            height: var(--d);
        }

        .face.top {
            transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
            background-image: linear-gradient(#fff4,#fff1);
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
        }

        .hub {
            position: absolute;
            left: -10px;
            top: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,#fff,#dca956);
        }

        .ray {
            position: absolute;
            left: 0;
            top: -3px;
            width: var(--r);
            height: 6px;
            background: #edc884;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .cab {
            position: absolute;
            width: 0;
            height: 0;
        }

        .post {
            position: absolute;
            top: -14px;
            width: 3px;
            height: 38px;
            background: linear-gradient(90deg,#678091,#eee,#678091);
        }

        .orrery {
            transform: rotateX(-25deg) rotateY(-20deg);
        }

        .sun {
            position: absolute;
            left: -25px;
            top: -25px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%,#fff4ad,#ed9e43 75%);
            box-shadow: 0 0 35px #f3c56777;
        }

        .orbit-track {
            position: absolute;
            left: calc(-1 * var(--radius));
            top: calc(-1 * var(--radius));
            width: calc(2 * var(--radius));
            height: calc(2 * var(--radius));
            border: 1px solid #e3c47f77;
            border-radius: 50%;
            transform: rotateX(90deg);
        }

        .planet-orbit {
            position: absolute;
            animation: orbit var(--duration) linear infinite;
        }

        .orbit-arm {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--radius);
            height: 5px;
            background: linear-gradient(#e6cf99,#896b51);
        }

        .world {
            position: absolute;
            left: var(--radius);
            top: calc(var(--size) / -2);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%,#fff,var(--planet) 40%,#293b57);
            animation: billboard var(--duration) linear infinite reverse;
        }

        .orbit-2 {
            animation-delay: -5s;
        }

        .orbit-2 .world {
            animation-delay: -5s;
        }

        .orbit-3 {
            animation-delay: -12s;
        }

        .orbit-3 .world {
            animation-delay: -12s;
        }

        @keyframes orbit {
            to {
                transform: rotateY(360deg);
            }
        }

        @keyframes billboard {
            to {
                transform: rotateY(360deg);
            }
        }

        @media (max-width: 540px) {
            .model {
                zoom: .78;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage * {
                animation-play-state: paused !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="model orrery">
            <div class="box base" style="--w:280px;--h:24px;--d:230px;--paint:#775e5b;left:-140px;top:115px;transform:translateZ(0px)">
                <span class="face front"></span>
                <span class="face back"></span>
                <span class="face right"></span>
                <span class="face left"></span>
                <span class="face top"></span>
                <span class="face bottom"></span>
            </div>
            <div class="box sun-post" style="--w:12px;--h:120px;--d:12px;--paint:#c9b17f;left:-6px;top:-5px;transform:translateZ(0px)">
                <span class="face front"></span>
                <span class="face back"></span>
                <span class="face right"></span>
                <span class="face left"></span>
                <span class="face top"></span>
                <span class="face bottom"></span>
            </div>
            <div class="sun"></div>
            <div class="orbit-track" style="--radius:65px"></div>
            <div class="planet-orbit orbit-1" style="--radius:65px;--duration:8s">
                <div class="orbit-arm"></div>
                <div class="world" style="--planet:#7cd9ca;--size:20px"></div>
            </div>
            <div class="orbit-track" style="--radius:105px"></div>
            <div class="planet-orbit orbit-2" style="--radius:105px;--duration:15s">
                <div class="orbit-arm"></div>
                <div class="world" style="--planet:#ee9c81;--size:28px"></div>
            </div>
            <div class="orbit-track" style="--radius:145px"></div>
            <div class="planet-orbit orbit-3" style="--radius:145px;--duration:24s">
                <div class="orbit-arm"></div>
                <div class="world" style="--planet:#b3a1df;--size:36px"></div>
            </div>
        </div>
    </div>
</body>
</html>
