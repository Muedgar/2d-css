<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>05 · The rescue helicopter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101c2b;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 400px;
            overflow: hidden;
            perspective: 850px;
            background: radial-gradient(ellipse at 50% 35%, #304e68, #15283e 70%);
            isolation: isolate;
        }

        .stage::before {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            top: calc(50% + 160px);
            height: 80px;
            background: radial-gradient(ellipse, #0008, transparent 70%);
            filter: blur(8px);
        }

        .model {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .model * {
            transform-style: preserve-3d;
        }

        .box {
            position: absolute;
            width: var(--w);
            height: var(--h);
        }

        .face {
            position: absolute;
            background: var(--paint);
            border: 1px solid #ffffff25;
            box-shadow: inset 0 0 20px #0002;
        }

        .face.front,.face.back {
            width: var(--w);
            height: var(--h);
        }

        .face.front {
            transform: translateZ(calc(var(--d) / 2));
            background-image: linear-gradient(135deg,#fff2,transparent);
        }

        .face.back {
            transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
        }

        .face.right,.face.left {
            left: calc((var(--w) - var(--d)) / 2);
            width: var(--d);
            height: var(--h);
            background-image: linear-gradient(#0002,#0004);
        }

        .face.right {
            transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
        }

        .face.left {
            transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
        }

        .face.top,.face.bottom {
            top: calc((var(--h) - var(--d)) / 2);
            width: var(--w);
            height: var(--d);
        }

        .face.top {
            transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
            background-image: linear-gradient(#fff4,#fff1);
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
        }

        .hub {
            position: absolute;
            left: -10px;
            top: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,#fff,#dca956);
        }

        .ray {
            position: absolute;
            left: 0;
            top: -3px;
            width: var(--r);
            height: 6px;
            background: #edc884;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .cab {
            position: absolute;
            width: 0;
            height: 0;
        }

        .post {
            position: absolute;
            top: -14px;
            width: 3px;
            height: 38px;
            background: linear-gradient(90deg,#678091,#eee,#678091);
        }

        .heli {
            transform: rotateX(-18deg) rotateY(-25deg);
        }

        .chopper {
            animation: hovering 4s ease-in-out infinite;
        }

        .cockpit {
            position: absolute;
            left: -60px;
            top: -30px;
            width: 58px;
            height: 43px;
            background: linear-gradient(130deg,#d3f9ef,#397b97);
            border: 4px solid #ffe2a4;
            border-radius: 20px 0 0 0;
            transform: translateZ(36px);
        }

        .rotor-mast {
            position: absolute;
            left: -3px;
            top: -65px;
            width: 6px;
            height: 30px;
            background: #dce7eb;
        }

        .main-rotor {
            position: absolute;
            top: -65px;
            animation: flightspin 1.5s linear infinite;
        }

        .blade {
            position: absolute;
            left: 0;
            top: -5px;
            width: var(--r);
            height: 10px;
            background: linear-gradient(90deg,#cbdbe3,#426079);
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .tail-rotor {
            position: absolute;
            left: 183px;
            top: -10px;
            animation: tailspin 1s linear infinite;
        }

        @keyframes flightspin {
            from {
                transform: rotateX(90deg) rotateZ(0);
            }
            to {
                transform: rotateX(90deg) rotateZ(360deg);
            }
        }

        @keyframes tailspin {
            from {
                transform: translateZ(16px) rotateZ(0);
            }
            to {
                transform: translateZ(16px) rotateZ(360deg);
            }
        }

        @keyframes hovering {
            50% {
                transform: translateY(-15px) rotateZ(-3deg);
            }
        }

        @media (max-width: 540px) {
            .model {
                zoom: .78;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage * {
                animation-play-state: paused !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="model heli">
            <div class="chopper">
                <div class="box fuselage" style="--w:125px;--h:70px;--d:70px;--paint:#f5b75f;left:-65px;top:-35px;transform:translateZ(0px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="box tail" style="--w:130px;--h:18px;--d:22px;--paint:#f5b75f;left:60px;top:-9px;transform:translateZ(0px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="box fin" style="--w:20px;--h:65px;--d:8px;--paint:#ef806e;left:174px;top:-65px;transform:translateZ(0px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="box skid" style="--w:155px;--h:9px;--d:8px;--paint:#c5dce1;left:-76px;top:70px;transform:translateZ(43px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="box skid" style="--w:155px;--h:9px;--d:8px;--paint:#c5dce1;left:-76px;top:70px;transform:translateZ(-43px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="box strut" style="--w:8px;--h:40px;--d:8px;--paint:#c5dce1;left:-40px;top:33px;transform:translateZ(43px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="box strut" style="--w:8px;--h:40px;--d:8px;--paint:#c5dce1;left:35px;top:33px;transform:translateZ(43px)">
                    <span class="face front"></span>
                    <span class="face back"></span>
                    <span class="face right"></span>
                    <span class="face left"></span>
                    <span class="face top"></span>
                    <span class="face bottom"></span>
                </div>
                <div class="cockpit"></div>
                <div class="main-rotor">
                    <div class="blade" style="--a:0deg;--r:130px"></div>
                    <div class="blade" style="--a:90deg;--r:130px"></div>
                    <div class="blade" style="--a:180deg;--r:130px"></div>
                    <div class="blade" style="--a:270deg;--r:130px"></div>
                </div>
                <div class="tail-rotor">
                    <div class="blade" style="--a:0deg;--r:28px"></div>
                    <div class="blade" style="--a:120deg;--r:28px"></div>
                    <div class="blade" style="--a:240deg;--r:28px"></div>
                </div>
                <div class="rotor-mast"></div>
            </div>
        </div>
    </div>
</body>
</html>
