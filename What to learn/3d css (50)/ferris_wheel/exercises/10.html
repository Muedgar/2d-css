<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>10 · The complete festival Ferris wheel</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101c2b;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 400px;
            overflow: hidden;
            perspective: 850px;
            background: radial-gradient(ellipse at 50% 35%, #304e68, #15283e 70%);
            isolation: isolate;
        }

        .stage::before {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            top: calc(50% + 160px);
            height: 80px;
            background: radial-gradient(ellipse, #0008, transparent 70%);
            filter: blur(8px);
        }

        .model {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .model * {
            transform-style: preserve-3d;
        }

        .box {
            position: absolute;
            width: var(--w);
            height: var(--h);
        }

        .face {
            position: absolute;
            background: var(--paint);
            border: 1px solid #ffffff25;
            box-shadow: inset 0 0 20px #0002;
        }

        .face.front,.face.back {
            width: var(--w);
            height: var(--h);
        }

        .face.front {
            transform: translateZ(calc(var(--d) / 2));
            background-image: linear-gradient(135deg,#fff2,transparent);
        }

        .face.back {
            transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
        }

        .face.right,.face.left {
            left: calc((var(--w) - var(--d)) / 2);
            width: var(--d);
            height: var(--h);
            background-image: linear-gradient(#0002,#0004);
        }

        .face.right {
            transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
        }

        .face.left {
            transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
        }

        .face.top,.face.bottom {
            top: calc((var(--h) - var(--d)) / 2);
            width: var(--w);
            height: var(--d);
        }

        .face.top {
            transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
            background-image: linear-gradient(#fff4,#fff1);
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
        }

        .hub {
            position: absolute;
            left: -10px;
            top: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,#fff,#dca956);
        }

        .ray {
            position: absolute;
            left: 0;
            top: -3px;
            width: var(--r);
            height: 6px;
            background: #edc884;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .cab {
            position: absolute;
            width: 0;
            height: 0;
        }

        .post {
            position: absolute;
            top: -14px;
            width: 3px;
            height: 38px;
            background: linear-gradient(90deg,#678091,#eee,#678091);
        }

        .ferris {
            transform: rotateX(-10deg) rotateY(-25deg);
        }

        .a-frame {
            position: absolute;
            left: -100px;
            top: 0;
            width: 200px;
            height: 155px;
            background: linear-gradient(90deg,#67879b,#c4d4da,#67879b);
            clip-path: polygon(50% 0,100% 100%,82% 100%,50% 22%,18% 100%,0 100%);
            transform: translateZ(var(--z));
        }

        .wheel-spin {
            position: absolute;
            animation: wheelturn 20s linear infinite;
        }

        .rim {
            position: absolute;
            left: -116px;
            top: -116px;
            width: 232px;
            height: 232px;
            border: 5px solid #d7e6e8;
            border-radius: 50%;
        }

        .front-rim {
            transform: translateZ(28px);
        }

        .back-rim {
            transform: translateZ(-28px);
        }

        .wing {
            position: absolute;
            transform: rotateZ(var(--a));
        }

        .beam {
            position: absolute;
            left: 0;
            top: -3px;
            width: 115px;
            height: 6px;
            background: linear-gradient(#fff,#6b91a6,#fff);
        }

        .front-beam {
            transform: translateZ(28px);
        }

        .back-beam {
            transform: translateZ(-28px);
        }

        .beam::after {
            content: "";
            position: absolute;
            inset: 0;
            background: inherit;
            transform: rotateX(90deg);
        }

        .pin {
            position: absolute;
            left: 112px;
            top: -3px;
            width: 6px;
            height: 6px;
            background: #d8e8e7;
            transform: rotateY(90deg) scaleX(10);
        }

        .pivot {
            position: absolute;
            left: 115px;
            top: 0;
            transform: rotateZ(calc(-1 * var(--a)));
        }

        .counter {
            animation: wheelturn 20s linear infinite reverse;
        }

        .counter .cab {
            top: 0;
            transform: scale(.72);
            transform-origin: 0 0;
        }

        .axle-cap {
            transform: translateZ(58px);
        }

        .ground-shadows {
            position: absolute;
            top: 154px;
        }

        .ground-shadows i {
            position: absolute;
            left: -40px;
            top: -30px;
            width: 80px;
            height: 60px;
            background: radial-gradient(#0b203a88,transparent 70%);
            animation: shadowmove 20s var(--delay) ease-in-out infinite,shadowfade 20s var(--delay) linear infinite;
        }

        @keyframes wheelturn {
            to {
                transform: rotateZ(360deg);
            }
        }

        @keyframes shadowmove {
            from {
                transform: translateX(110px) rotateX(90deg);
            }
            to {
                transform: translateX(-110px) rotateX(90deg);
            }
        }

        @keyframes shadowfade {
            0%,100% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
        }

        @media (max-width: 540px) {
            .model {
                zoom: .78;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage * {
                animation-play-state: paused !important;
            }
        }
    </style>
