<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>02 · The hillside windmill</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101c2b;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 400px;
            overflow: hidden;
            perspective: 850px;
            background: radial-gradient(ellipse at 50% 35%, #304e68, #15283e 70%);
            isolation: isolate;
        }

        .stage::before {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            top: calc(50% + 160px);
            height: 80px;
            background: radial-gradient(ellipse, #0008, transparent 70%);
            filter: blur(8px);
        }

        .model {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .model * {
            transform-style: preserve-3d;
        }

        .box {
            position: absolute;
            width: var(--w);
            height: var(--h);
        }

        .face {
            position: absolute;
            background: var(--paint);
            border: 1px solid #ffffff25;
            box-shadow: inset 0 0 20px #0002;
        }

        .face.front,.face.back {
            width: var(--w);
            height: var(--h);
        }

        .face.front {
            transform: translateZ(calc(var(--d) / 2));
            background-image: linear-gradient(135deg,#fff2,transparent);
        }

        .face.back {
            transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
        }

        .face.right,.face.left {
            left: calc((var(--w) - var(--d)) / 2);
            width: var(--d);
            height: var(--h);
            background-image: linear-gradient(#0002,#0004);
        }

        .face.right {
            transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
        }

        .face.left {
            transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
        }

        .face.top,.face.bottom {
            top: calc((var(--h) - var(--d)) / 2);
            width: var(--w);
            height: var(--d);
        }

        .face.top {
            transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
            background-image: linear-gradient(#fff4,#fff1);
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
        }

        .hub {
            position: absolute;
            left: -10px;
            top: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,#fff,#dca956);
        }

        .ray {
            position: absolute;
            left: 0;
            top: -3px;
            width: var(--r);
            height: 6px;
            background: #edc884;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .cab {
            position: absolute;
            width: 0;
            height: 0;
        }

        .post {
            position: absolute;
            top: -14px;
            width: 3px;
            height: 38px;
            background: linear-gradient(90deg,#678091,#eee,#678091);
        }

        .mill {
            transform: rotateX(-10deg) rotateY(-20deg);
        }

        .roof-peak {
            position: absolute;
            left: -66px;
            top: -100px;
            width: 132px;
            height: 75px;
            background: linear-gradient(135deg,#df7663,#a34543);
            clip-path: polygon(50% 0,100% 100%,0 100%);
            transform: translateZ(50px);
        }

        .door {
            position: absolute;
            left: -16px;
            top: 55px;
            width: 32px;
            height: 55px;
            border-radius: 20px 20px 0 0;
            background: #624843;
            transform: translateZ(46px);
        }

        .rotor {
            position: absolute;
            top: -22px;
            transform: translateZ(62px);
        }

        .rotor {
            animation: millspin 12s linear infinite;
        }

        .sail {
            position: absolute;
            left: 0;
            top: -7px;
            width: 108px;
            height: 14px;
            background: #d8a36c;
            transform-origin: 0 50%;
            transform: rotateZ(var(--a));
        }

        .sail::after {
            content: "";
            position: absolute;
            right: 0;
            top: -22px;
            width: 65px;
            height: 36px;
            border: 3px solid #eed6ab;
            background: repeating-linear-gradient(90deg,#fff1cf 0 10px,#b89d7d 10px 13px);
        }

        @keyframes millspin {
            from {
                transform: translateZ(62px) rotateZ(0);
            }
            to {
                transform: translateZ(62px) rotateZ(360deg);
            }
        }

        @media (max-width: 540px) {
            .model {
                zoom: .78;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage * {
                animation-play-state: paused !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="model mill">
            <div class="box land" style="--w:260px;--h:16px;--d:190px;--paint:#477e60;left:-130px;top:110px;transform:translateZ(0px)">
                <span class="face front"></span>
                <span class="face back"></span>
                <span class="face right"></span>
                <span class="face left"></span>
                <span class="face top"></span>
                <span class="face bottom"></span>
            </div>
            <div class="box house" style="--w:100px;--h:140px;--d:90px;--paint:#ffe2ac;left:-50px;top:-30px;transform:translateZ(0px)">
                <span class="face front"></span>
                <span class="face back"></span>
                <span class="face right"></span>
                <span class="face left"></span>
                <span class="face top"></span>
                <span class="face bottom"></span>
            </div>
            <div class="roof-peak"></div>
            <div class="door"></div>
            <div class="rotor">
                <div class="sail" style="--a:0deg;--r:108px"></div>
                <div class="sail" style="--a:90deg;--r:108px"></div>
                <div class="sail" style="--a:180deg;--r:108px"></div>
                <div class="sail" style="--a:270deg;--r:108px"></div>
                <b class="hub"></b>
            </div>
        </div>
    </div>
</body>
</html>
