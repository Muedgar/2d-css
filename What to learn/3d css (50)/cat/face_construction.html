<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  .face {
    position: absolute;
    top: 100px; left: 100px;
    width: 140px; height: 111px;
    transform-style: preserve-3d;
  }
  
  .face::before {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    background-color: #1c1c1c;
    clip-path: polygon(0% 0%, 100% 0%, 64% 100%);
  }
  
  .face-side {
    position: absolute;
    left: 90px; top: 100%;
    width: 146px; height: 145px;
    transform: rotateZ(141deg) rotateY(-86.92deg);
    transform-style: preserve-3d;
  }
  
  .face-side::before {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    background-color: #0a7ca3;
    clip-path: polygon(0% 0.2%, 91% 0%, 100% 100%, 0% 98.4%);
  }
</style>
<body>
    
<div class="face">
  <div class="face-side"></div>
</div>
</body>
</html>
